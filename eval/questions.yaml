      - 68/2026/NĐ-CP Điều 12
      - 141/2026/NĐ-CP Điều 1
  - id: q02
    question: Lương gross của tôi 25 triệu một tháng, đóng bảo hiểm bắt buộc trên đủ mức lương đó, có một con nhỏ đang đi học, thì mỗi tháng tôi bị trừ thuế thu nhập khoảng bao nhiêu?
    tax_type: pit
    form: plain
    answer: >
      Nếu là cá nhân cư trú và đã đăng ký con (dưới 18 tuổi) là người phụ thuộc, thu nhập tính thuế
      mỗi tháng = 25 triệu − các khoản bảo hiểm bắt buộc − 15,5 triệu (bản thân) − 6,2 triệu (con) =
      3,3 triệu đồng trừ số bảo hiểm bắt buộc. Phần này dưới 10 triệu đồng nên chịu thuế suất 5% (bậc 1),
      tức số thuế mỗi tháng bằng 5% × (3,3 triệu − bảo hiểm bắt buộc), dưới 165.000 đồng. Tỷ lệ đóng bảo
      hiểm bắt buộc không có trong các văn bản này nên không tính ra con số chính xác.
    key_facts:
      - "giảm trừ bản thân 15,5 triệu đồng/tháng"
      - "giảm trừ người phụ thuộc 6,2 triệu đồng/tháng"
      - "bậc 1: thu nhập tính thuế đến 10 triệu đồng/tháng, thuế suất 5%"
      - "thuế mỗi tháng bằng 5% × (3,3 triệu đồng − bảo hiểm bắt buộc), dưới 165.000 đồng"
    provisions:
      - 109/2025/QH15 Điều 8
      - 109/2025/QH15 Điều 9
      - 109/2025/QH15 Điều 10
      - 253/2026/NĐ-CP Điều 46
      - 253/2026/NĐ-CP Điều 47
  - id: q03
    question: Công ty nộp tiền thuế GTGT quý trễ 10 ngày thì tiền chậm nộp tính thế nào?
    tax_type: administration
    form: plain
    answer: >
      Tiền chậm nộp bằng 0,03%/ngày tính trên số tiền thuế nộp chậm. Thời hạn nộp thuế GTGT khai theo
      quý là ngày cuối cùng của tháng đầu của quý tiếp theo; số ngày chậm tính liên tục từ ngày tiếp theo
      ngày hết hạn đến ngày liền kề trước ngày nộp tiền. Chậm 10 ngày thì tiền chậm nộp = số thuế chậm
      nộp × 0,03% × 10 = 0,3% số thuế.
    key_facts:
      - "mức tiền chậm nộp 0,03%/ngày trên số tiền thuế chậm nộp"
      - "hạn nộp thuế khai theo quý: ngày cuối cùng của tháng đầu của quý tiếp theo"
      - "tính từ ngày tiếp theo ngày hết hạn đến ngày liền kề trước ngày nộp"
      - "chậm 10 ngày: 0,3% số thuế chậm nộp"
    provisions:
      - 108/2025/QH15 Điều 14 khoản 1
      - 108/2025/QH15 Điều 16 khoản 1
      - 108/2025/QH15 Điều 16 khoản 2
      - 252/2026/NĐ-CP Điều 10 khoản 3
      - 252/2026/NĐ-CP Điều 26 khoản 1
  - id: q04  # phase 2: Law 90/2025 amends point a cl 1 Art 9 (0% exports) from outside the corpus; the answer uses cl 2 (5%) only, which that amendment does not touch
    question: Điều 9 Luật 48/2024 quy định những hàng hóa, dịch vụ nào được áp thuế suất 5%?
    tax_type: vat
    form: reference
    answer: >
      Thuế suất 5% (khoản 2 Điều 9) áp dụng cho: nước sạch phục vụ sản xuất và sinh hoạt (trừ nước
      đóng chai, đóng bình, nước giải khát); phân bón, quặng sản xuất phân bón, thuốc bảo vệ thực vật,
      chất kích thích tăng trưởng vật nuôi; dịch vụ đào đắp, nạo vét kênh mương phục vụ nông nghiệp, chăm
      sóc cây trồng, sơ chế, bảo quản nông sản; sản phẩm trồng trọt, chăn nuôi, thủy sản chưa chế biến (trừ
      gỗ, măng và trừ trường hợp không chịu thuế); mủ cao su sơ chế, lưới, dây giềng, sợi đan lưới; sản
      phẩm thủ công từ nguyên liệu nông nghiệp, xơ bông, giấy in báo; tàu khai thác thủy sản, máy móc
      chuyên dùng cho nông nghiệp; thiết bị y tế, thuốc phòng, chữa bệnh, dược chất, dược liệu; thiết bị
      giảng dạy, học tập; nghệ thuật biểu diễn truyền thống, dân gian; đồ chơi trẻ em, sách các loại;
      dịch vụ khoa học, công nghệ; bán, cho thuê, cho thuê mua nhà ở xã hội.
    key_facts:
      - "nước sạch phục vụ sản xuất và sinh hoạt, không gồm nước đóng chai, đóng bình"
      - "phân bón, thuốc bảo vệ thực vật"
      - "thiết bị y tế, thuốc phòng bệnh, chữa bệnh"
      - "đồ chơi trẻ em, sách; nhà ở xã hội"
    provisions:
      - 48/2024/QH15 Điều 9 khoản 2
  - id: q05
    question: Công ty nhỏ, doanh thu năm chưa tới 3 tỷ, thì thuế suất thu nhập doanh nghiệp là bao nhiêu?
    tax_type: cit
    form: plain
    answer: >
      Tùy tổng doanh thu năm trước liền kề: nếu từ 01 tỷ đồng trở xuống thì thu nhập được miễn thuế TNDN
      (không áp dụng cho công ty con, công ty có quan hệ liên kết mà bên liên kết không đáp ứng điều kiện
      miễn); nếu trên 01 tỷ đến không quá 03 tỷ đồng thì thuế suất 15%.
    key_facts:
      - "tổng doanh thu năm từ 01 tỷ đồng trở xuống: miễn thuế TNDN"
      - "tổng doanh thu năm không quá 03 tỷ đồng: thuế suất 15%"
      - "doanh thu làm căn cứ là của kỳ tính thuế năm trước liền kề"
      - "miễn thuế không áp dụng cho công ty con, công ty liên kết có bên liên kết không đủ điều kiện miễn"
    provisions:
      - 67/2025/QH15 Điều 10 khoản 2
      - 09/2026/QH16 Điều 3
      - 141/2026/NĐ-CP Điều 2
  - id: q06
    question: Nước ngọt có đường có bị đánh thuế tiêu thụ đặc biệt không, nếu có thì từ khi nào?
    tax_type: sct
    form: plain
    answer: >
      Có. Nước giải khát theo TCVN có hàm lượng đường trên 5g/100ml thuộc đối tượng chịu thuế tiêu thụ
      đặc biệt, với thuế suất 8% từ ngày 01/01/2027 và 10% từ ngày 01/01/2028.
    key_facts:
      - "nước giải khát có hàm lượng đường trên 5g/100ml chịu thuế TTĐB"
      - "thuế suất 8% từ 01/01/2027"
      - "thuế suất 10% từ 01/01/2028"
    provisions:
      - 66/2025/QH15 Điều 2 khoản 1
      - 66/2025/QH15 Điều 8 khoản 1
      - 09/2026/QH16 Điều 4
  - id: q08
    question: Em làm freelance thiết kế, nhận tiền từ khách nước ngoài qua PayPal, vậy em có phải tự khai thuế không hay khỏi?
    tax_type: pit
    form: plain
    answer: >
      Tùy em có đăng ký kinh doanh hay không. Nếu không đăng ký kinh doanh, tiền thù lao cung cấp dịch
      vụ là thu nhập từ tiền lương, tiền công; khách là tổ chức nước ngoài không đăng ký thuế tại Việt Nam
      nên không ai khấu trừ thay, em phải tự kê khai, nộp thuế. Nếu em là cá nhân kinh doanh (cư trú) thì
      tính thuế theo thu nhập kinh doanh: doanh thu năm từ 01 tỷ đồng trở xuống không phải nộp thuế TNCN.
    key_facts:
      - "không đăng ký kinh doanh: tiền thù lao cung cấp dịch vụ là thu nhập từ tiền lương, tiền công"
      - "thu nhập do tổ chức nước ngoài không đăng ký thuế tại Việt Nam chi trả: cá nhân tự kê khai, nộp thuế"
      - "cá nhân kinh doanh có doanh thu năm từ 01 tỷ đồng trở xuống không phải nộp thuế TNCN"
    provisions:
      - 253/2026/NĐ-CP Điều 8 khoản 2
      - 253/2026/NĐ-CP Điều 67 khoản 5
      - 68/2026/NĐ-CP Điều 4 khoản 1
      - 141/2026/NĐ-CP Điều 1
  - id: q09
    question: Tôi cho thuê căn hộ 15 triệu một tháng, có phải nộp thuế không và nộp bao nhiêu phần trăm?
    tax_type: pit
    form: plain
    answer: >
      Cho thuê 15 triệu/tháng tức 180 triệu đồng/năm, từ 01 tỷ đồng trở xuống nên không chịu thuế GTGT
      và không phải nộp thuế TNCN. Chỉ khi doanh thu cho thuê năm trên 01 tỷ đồng mới phải nộp thuế TNCN
      bằng 5% trên phần doanh thu vượt mức này.
    key_facts:
      - "doanh thu năm 180 triệu đồng"
      - "doanh thu năm từ 01 tỷ đồng trở xuống: không chịu thuế GTGT, không phải nộp thuế TNCN"
      - "trên ngưỡng: thuế TNCN 5% trên phần doanh thu vượt ngưỡng"
    provisions:
      - 68/2026/NĐ-CP Điều 3
      - 68/2026/NĐ-CP Điều 4 khoản 1
      - 141/2026/NĐ-CP Điều 1
      - 109/2025/QH15 Điều 7
      - 09/2026/QH16 Điều 1
  - id: q10
    question: Theo Luật Quản lý thuế 108/2025, doanh nghiệp được gia hạn nộp thuế trong những trường hợp nào?
    tax_type: administration
    form: reference
    answer: >
      Người nộp thuế được gia hạn nộp thuế khi: bị thiệt hại vật chất ảnh hưởng trực tiếp đến sản xuất,
      kinh doanh do bất khả kháng (gia hạn 02 năm kể từ ngày xảy ra sự kiện); phải ngừng hoạt động do di
      dời cơ sở theo yêu cầu của cơ quan nhà nước (gia hạn 01 năm kể từ ngày ngừng hoạt động); và gia hạn
      trong trường hợp đặc biệt do Chính phủ quy định. Trong thời gian gia hạn không phải nộp tiền chậm nộp
      trên số thuế được gia hạn.
    key_facts:
      - "thiệt hại do bất khả kháng: gia hạn 02 năm kể từ ngày xảy ra sự kiện"
      - "ngừng hoạt động do di dời theo yêu cầu cơ quan nhà nước: gia hạn 01 năm"
      - "gia hạn trong trường hợp đặc biệt do Chính phủ quy định"
      - "không tính tiền chậm nộp trong thời gian gia hạn"
    provisions:
      - 108/2025/QH15 Điều 14 khoản 7
      - 252/2026/NĐ-CP Điều 25 khoản 3
      - 252/2026/NĐ-CP Điều 25 khoản 4
