  - id: q157
    question: Theo Nghị định 253/2026, tiền thuê nhà công ty trả hộ cho nhân viên được tính vào thu nhập chịu thuế tối đa bao nhiêu?
    tax_type: pit
    form: reference
    answer: >
      Tiền thuê nhà, điện, nước và dịch vụ kèm theo do công ty trả thay được tính vào thu nhập chịu thuế theo số thực trả nhưng không vượt
      quá 15% tổng thu nhập chịu thuế của người lao động phát sinh tại đơn vị (chưa gồm tiền thuê nhà). Nhà ở do công ty xây cho người lao
      động thì không tính.
    key_facts:
