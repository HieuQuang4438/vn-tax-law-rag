  - id: q246  # step 2: moved to answerable; 141/2026/NĐ-CP Điều 1 already raised the threshold to 01 tỷ from 01/01/2026
    question: Bộ Tài chính có dự định nâng ngưỡng doanh thu không phải nộp thuế của hộ kinh doanh lên 1 tỷ không?
    tax_type: household
    form: plain
    answer: >
