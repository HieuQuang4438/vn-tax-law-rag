      # phase 2: 48/2024 Art 15 cl 9 is listed with 149/2025 Art 1, which repeals its point c; the answer uses points a and b
      - question: Doanh nghiệp xuất khẩu được hoàn thuế giá trị gia tăng trong trường hợp nào?
        tax_type: vat
        form: plain
        answer: >
          Doanh nghiệp trong tháng, quý có hàng hóa, dịch vụ xuất khẩu, nếu số thuế GTGT đầu vào chưa được khấu trừ
          hết từ 300 triệu đồng trở lên thì được hoàn theo tháng, quý; không áp dụng với hàng nhập khẩu rồi xuất
          khẩu sang nước khác. Số thuế được hoàn không vượt quá 10% doanh thu hàng xuất khẩu của kỳ hoàn thuế, phần
          vượt được khấu trừ sang kỳ sau. Doanh nghiệp phải nộp thuế theo phương pháp khấu trừ.
        key_facts:
          - "thuế GTGT đầu vào chưa khấu trừ hết từ 300 triệu đồng trở lên"
          - "không vượt quá 10% doanh thu hàng hóa, dịch vụ xuất khẩu của kỳ hoàn thuế"
          - "không hoàn với hàng nhập khẩu sau đó xuất khẩu sang nước khác"
          - "phải là cơ sở kinh doanh nộp thuế theo phương pháp khấu trừ"
        provisions:
