  - id: q33  # phase 2: answered by 89/2026/TT-BTC Art 21 cl 1 and 3 and 252/2026/NĐ-CP Art 24: CIT is paid provisionally by quarter and settled yearly, with no quarterly provisional return; moved to answerable
    question: Doanh nghiệp vẫn phải nộp tờ khai thuế thu nhập doanh nghiệp tạm tính hằng quý đúng không?
    tax_type: cit
    form: plain
    answer: >
      Các văn bản không nêu tờ khai tạm tính quý: thuế TNDN là loại thuế tạm nộp theo quý và quyết toán năm. Doanh
      nghiệp tự xác định số thuế tạm nộp quý (căn cứ báo cáo tài chính quý hoặc kết quả kinh doanh quý) và nộp
      tiền chậm nhất ngày cuối cùng của tháng đầu quý tiếp theo; tổng số đã tạm nộp của 04 quý không được thấp
      hơn 80% số thuế phải nộp theo quyết toán năm, nếu thiếu thì tính tiền chậm nộp trên phần thiếu.
    key_facts:
      - "thuế TNDN tạm nộp theo quý và quyết toán năm"
      - "hạn tạm nộp: ngày cuối cùng của tháng đầu quý tiếp theo"
      - "tổng tạm nộp 04 quý không thấp hơn 80% số thuế quyết toán năm"
    provisions:
      - 89/2026/TT-BTC Điều 21 khoản 1
      - 89/2026/TT-BTC Điều 21 khoản 3
      - 252/2026/NĐ-CP Điều 24
  - id: q34
    question: Theo Nghị định 360/2025, nhà máy bia mua nguyên liệu đã chịu thuế tiêu thụ đặc biệt thì có được khấu trừ số thuế đó không?
    tax_type: sct
    form: reference
    answer: >
      Có. Nhà máy sản xuất hàng hóa chịu thuế TTĐB từ nguyên liệu đã nộp thuế TTĐB (nhập khẩu hoặc mua trực
      tiếp của nhà sản xuất trong nước) được khấu trừ số thuế đã nộp, tương ứng với lượng nguyên liệu dùng
      để sản xuất hàng bán ra, khi có chứng từ hợp pháp: chứng từ nộp thuế ở khâu nhập khẩu, hoặc với nguyên
      liệu mua trong nước là hợp đồng mua của nhà sản xuất, chứng từ thanh toán không dùng tiền mặt và hóa
      đơn GTGT. Phần không được khấu trừ được tính vào chi phí khi tính thuế TNDN.
    key_facts:
      - "được khấu trừ số thuế TTĐB đã nộp của nguyên liệu tương ứng với hàng bán ra"
      - "nguyên liệu nhập khẩu: chứng từ nộp thuế TTĐB ở khâu nhập khẩu"
      - "nguyên liệu mua trong nước: hợp đồng mua của nhà sản xuất, chứng từ thanh toán không dùng tiền mặt, hóa đơn GTGT"
      - "số thuế không được khấu trừ được tính vào chi phí tính thuế TNDN"
    provisions:
      - 66/2025/QH15 Điều 9 khoản 2
      - 360/2025/NĐ-CP Điều 8 khoản 2
      - 360/2025/NĐ-CP Điều 8 khoản 5
      - 360/2025/NĐ-CP Điều 8 khoản 6
  - id: q35  # phase 2: Thông tư 18/2026 named in the question sets the forms only (Art 4); the monthly/quarterly period is in 68/2026/NĐ-CP Điều 10, threshold raised by 141/2026/NĐ-CP Điều 1
    question: Thông tư 18/2026 quy định hộ kinh doanh khai thuế theo tháng hay theo quý?
    tax_type: household
    form: reference
    answer: >
      Thông tư 18/2026 chỉ quy định mẫu hồ sơ; kỳ khai do Nghị định 68/2026 quy định. Hộ kinh doanh có
      doanh thu năm từ 01 tỷ đồng trở xuống không khai thuế mà thông báo doanh thu thực tế một lần trong năm.
      Hộ có doanh thu trên 01 tỷ đồng khai, nộp thuế GTGT theo quý nếu doanh thu năm từ 50 tỷ đồng trở xuống,
      theo tháng nếu trên 50 tỷ đồng; thuế TNCN khai cùng kỳ trên cùng hồ sơ khai thuế GTGT.
    key_facts:
      - "doanh thu năm từ 50 tỷ đồng trở xuống: khai theo quý"
      - "doanh thu năm trên 50 tỷ đồng: khai theo tháng"
      - "doanh thu năm từ 01 tỷ đồng trở xuống: chỉ thông báo doanh thu"
    provisions:
      - 68/2026/NĐ-CP Điều 10
      - 68/2026/NĐ-CP Điều 8 khoản 1
      - 141/2026/NĐ-CP Điều 1
      - 18/2026/TT-BTC Điều 4 khoản 1
  - id: q37
    question: Sau khi có Luật 149/2025, doanh nghiệp bán nông sản chưa qua chế biến cho doanh nghiệp khác có phải tính thuế GTGT không?
    tax_type: vat
    form: reference
    answer: >
      Doanh nghiệp tự sản xuất, đánh bắt bán ra thì sản phẩm chưa chế biến (hoặc chỉ qua sơ chế thông thường)
      là đối tượng không chịu thuế GTGT. Doanh nghiệp mua sản phẩm đó rồi bán cho doanh nghiệp, hợp tác xã
      khác thì không phải kê khai, tính nộp thuế GTGT nhưng được khấu trừ thuế GTGT đầu vào. Nếu bán cho hộ,
      cá nhân kinh doanh hoặc đối tượng khác thì doanh nghiệp nộp theo phương pháp khấu trừ tính thuế suất 5%.
    key_facts:
      - "tự sản xuất, đánh bắt bán ra: không chịu thuế GTGT"
      - "mua về bán cho doanh nghiệp, hợp tác xã khác: không phải kê khai, tính nộp thuế GTGT"
      - "vẫn được khấu trừ thuế GTGT đầu vào"
      - "bán cho hộ, cá nhân kinh doanh và đối tượng khác: thuế suất 5%"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 1
      - 149/2025/QH15 Điều 1
      - 181/2025/NĐ-CP Điều 4  # review: the provision 359/2025 Art 1 inserts into (clause 1b); 144/2026 Art 1 amends clause 4 point đ, which the answer does not use
      - 359/2025/NĐ-CP Điều 1
  - id: q38
    question: Hộ kinh doanh có doanh thu trên 1 tỷ một năm thì tính thuế theo cách nào?
    tax_type: household
    form: plain
    answer: >
      Thuế GTGT tính trực tiếp bằng tỷ lệ % nhân doanh thu. Thuế TNCN: nếu doanh thu năm trên 01 tỷ đến 03
      tỷ đồng, hộ được chọn tính bằng thuế suất nhân phần doanh thu vượt 01 tỷ (phân phối hàng hóa 0,5%;
      dịch vụ 2%; sản xuất, vận tải 1,5%…) hoặc bằng (doanh thu − chi phí) × 15%; nếu trên 03 tỷ đồng thì bắt
      buộc tính theo thu nhập tính thuế × 17% (đến 50 tỷ) hoặc 20% (trên 50 tỷ). Phương pháp theo thu nhập
      đã chọn phải giữ ổn định 02 năm liên tục.
    key_facts:
      - "thuế GTGT: tỷ lệ % nhân doanh thu"
      - "trên 01 tỷ đến 03 tỷ đồng: chọn thuế suất × phần doanh thu vượt 01 tỷ, hoặc thu nhập tính thuế × 15%"
      - "trên 03 tỷ đến 50 tỷ đồng: thu nhập tính thuế × 17%; trên 50 tỷ đồng: 20%"
      - "ổn định phương pháp tính theo thu nhập 02 năm liên tục"
    provisions:
      - 68/2026/NĐ-CP Điều 3
      - 68/2026/NĐ-CP Điều 4 khoản 5
      - 141/2026/NĐ-CP Điều 1
      - 109/2025/QH15 Điều 7
      - 09/2026/QH16 Điều 1
  - id: q40
    question: Năm ngoái công ty lỗ 500 triệu, năm nay có lãi thì được trừ khoản lỗ đó không, chuyển lỗ tối đa mấy năm?
    tax_type: cit
    form: plain
    answer: >
      Được. Doanh nghiệp có lỗ được chuyển toàn bộ và liên tục số lỗ vào thu nhập chịu thuế các năm sau,
      thời gian chuyển lỗ không quá 05 năm liên tục kể từ năm tiếp theo năm phát sinh lỗ; quá 05 năm thì phần
      lỗ chưa chuyển hết không được chuyển tiếp. Trong năm, lỗ được tạm chuyển vào thu nhập các quý khi xác
      định số thuế tạm nộp và chuyển chính thức khi quyết toán năm.
    key_facts:
      - "được chuyển lỗ vào thu nhập chịu thuế năm sau"
      - "tối đa 05 năm liên tục kể từ năm tiếp theo năm phát sinh lỗ"
      - "chuyển toàn bộ và liên tục"
    provisions:
      - 67/2025/QH15 Điều 16 khoản 1
      - 320/2025/NĐ-CP Điều 7 khoản 2
  - id: q41
    question: Cuối năm tôi có thu nhập từ hai công ty khác nhau, vậy có phải tự quyết toán thuế TNCN không?
    tax_type: pit
    form: plain
    answer: >
      Thường là có: cá nhân cư trú có thu nhập từ tiền lương, tiền công phải quyết toán năm. Không phải quyết
      toán nếu số thuế phải nộp nhỏ hơn số đã nộp mà không đề nghị hoàn hay bù trừ; phần thu nhập ở nơi thứ hai
      bình quân tháng không quá 15 triệu đồng đã bị khấu trừ 10% thì không phải quyết toán phần đó, và khi đó
      có thể ủy quyền cho công ty chính (hợp đồng từ 03 tháng, đang làm việc) quyết toán thay. Nếu tự quyết
      toán thì hạn nộp hồ sơ là ngày cuối cùng của tháng thứ 04 kể từ khi kết thúc năm.
    key_facts:
      - "thu nhập nơi khác bình quân tháng không quá 15 triệu đồng đã khấu trừ 10%: không phải quyết toán phần này"
      - "được ủy quyền cho tổ chức chi trả (hợp đồng từ 03 tháng, đang làm việc) quyết toán thay"
      - "số thuế phải nộp nhỏ hơn số đã nộp và không đề nghị hoàn: không phải quyết toán"
      - "tự quyết toán: hạn ngày cuối cùng của tháng thứ 04 kể từ ngày kết thúc năm dương lịch"
    provisions:
      - 253/2026/NĐ-CP Điều 51 khoản 1
      - 253/2026/NĐ-CP Điều 51 khoản 2
      - 252/2026/NĐ-CP Điều 10 khoản 5
  - id: q42
    question: Công ty mua máy móc thiết bị để sản xuất thì chi phí khấu hao được tính vào chi phí được trừ như thế nào?
    tax_type: cit
    form: plain
    answer: >
      Chi phí khấu hao máy móc, thiết bị được trừ khi trích theo quy định của Bộ trưởng Bộ Tài chính về chế
      độ quản lý, sử dụng và trích khấu hao tài sản cố định (kể cả khấu hao nhanh nếu kinh doanh có lãi). Không
      được trừ khấu hao của tài sản không dùng cho sản xuất kinh doanh, không có giấy tờ chứng minh quyền sở
      hữu (trừ thuê tài chính), không được theo dõi, hạch toán trong sổ kế toán, phần trích vượt mức hoặc tài
      sản đã khấu hao hết giá trị.
    key_facts:
      - "trích khấu hao theo quy định của Bộ trưởng Bộ Tài chính, kể cả khấu hao nhanh nếu kinh doanh có lãi"
      - "tài sản phải dùng cho sản xuất, kinh doanh và có giấy tờ chứng minh quyền sở hữu"
      - "tài sản phải được quản lý, theo dõi, hạch toán trong sổ kế toán"
      - "không trừ phần vượt mức hoặc tài sản đã khấu hao hết giá trị"
    provisions:
      - 67/2025/QH15 Điều 9 khoản 2
      - 320/2025/NĐ-CP Điều 10 khoản 6
  - id: q43
    question: Hộ kinh doanh của tôi có cần lưu sổ sách ghi chép doanh thu và chi phí không, hay chỉ cần giữ hóa đơn?
    tax_type: household
    form: plain
    answer: >
      Không chỉ giữ hóa đơn: hộ kinh doanh có trách nhiệm sử dụng sổ kế toán theo pháp luật kế toán và hướng
      dẫn của Bộ trưởng Bộ Tài chính, sử dụng hóa đơn theo quy định, và phải cung cấp sổ kế toán, hóa đơn,
      phần mềm quản lý bán hàng khi cơ quan thuế kiểm tra. Nếu tính thuế TNCN theo thu nhập, chi phí chỉ được
      trừ khi có đủ hóa đơn, chứng từ.
    key_facts:
      - "sử dụng sổ kế toán theo pháp luật kế toán và hướng dẫn của Bộ trưởng Bộ Tài chính"
      - "cung cấp sổ kế toán, hóa đơn, phần mềm quản lý bán hàng khi cơ quan thuế kiểm tra"
      - "chi phí được trừ phải có đủ hóa đơn, chứng từ"
    provisions:
      - 68/2026/NĐ-CP Điều 13 khoản 5
      - 68/2026/NĐ-CP Điều 13 khoản 6
      - 68/2026/NĐ-CP Điều 6 khoản 1
  - id: q44
    question: Công ty nộp thừa tiền thuế GTGT thì có được bù trừ sang kỳ sau không hay phải làm thủ tục hoàn thuế?
    tax_type: vat
    form: plain
    answer: >
      Được bù trừ hoặc hoàn. Số thuế nộp thừa được bù trừ với số thuế phải nộp (cùng hoặc khác loại thuế),
      do Hệ thống thông tin quản lý thuế tự động thực hiện hoặc theo đề nghị của doanh nghiệp, hoặc được hoàn
      trả khi doanh nghiệp không còn nợ thuế. Không hoàn trả nếu doanh nghiệp từ chối nhận lại hoặc quá 10 năm
      kể từ ngày nộp mà không bù trừ, không đề nghị hoàn.
    key_facts:
      - "được bù trừ với số thuế phải nộp hoặc hoàn trả khi không còn nợ thuế"
      - "bù trừ tự động qua Hệ thống thông tin quản lý thuế hoặc theo đề nghị"
      - "không hoàn trả nếu quá 10 năm kể từ ngày nộp mà không bù trừ, không đề nghị hoàn"
    provisions:
      - 108/2025/QH15 Điều 15 khoản 2
      - 108/2025/QH15 Điều 15 khoản 4
      - 89/2026/TT-BTC Điều 42
  - id: q45
    question: Nếu doanh nghiệp khai sai tờ khai thuế nhưng chưa bị cơ quan thuế phát hiện thì có được tự khai bổ sung không?
    tax_type: administration
    form: plain
    answer: >
      Được. Doanh nghiệp được khai bổ sung trong 05 năm kể từ ngày hết hạn nộp hồ sơ khai thuế của kỳ có sai,
      sót, nếu trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định thanh tra, kiểm tra. Nếu khai
      bổ sung làm tăng số thuế phải nộp thì phải nộp đủ tiền thuế và tiền chậm nộp (0,03%/ngày), nhưng không bị
      xử phạt nếu đã khai bổ sung và nộp đủ trước khi cơ quan thuế công bố quyết định kiểm tra hoặc phát hiện.
    key_facts:
      - "khai bổ sung trong 05 năm kể từ ngày hết hạn nộp hồ sơ của kỳ có sai, sót"
      - "trước khi công bố quyết định thanh tra, kiểm tra"
      - "khai bổ sung tăng số thuế: nộp tiền chậm nộp 0,03%/ngày"
      - "không bị xử phạt nếu nộp đủ trước khi cơ quan thuế công bố quyết định kiểm tra"
    provisions:
      - 108/2025/QH15 Điều 12 khoản 5
      - 108/2025/QH15 Điều 16 khoản 1
      - 108/2025/QH15 Điều 16 khoản 2
      - 108/2025/QH15 Điều 44 khoản 2
      - 252/2026/NĐ-CP Điều 12 khoản 1
  - id: q46
    question: Năm 2025 ô tô sản xuất, lắp ráp trong nước được gia hạn nộp thuế tiêu thụ đặc biệt đến khi nào?
    tax_type: sct
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu không quy định việc gia hạn nộp thuế tiêu thụ đặc biệt đối với ô tô sản
      xuất, lắp ráp trong nước năm 2025; nội dung này thuộc nghị định riêng của Chính phủ về gia hạn nộp thuế.
    unanswerable: out_of_scope
  - id: q47
    question: Tôi là người Hàn Quốc làm việc ở Việt Nam, theo hiệp định tránh đánh thuế hai lần giữa Việt Nam và Hàn Quốc thì tiền lương của tôi có được miễn thuế ở Việt Nam không?
    tax_type: pit
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu không chứa nội dung Hiệp định tránh đánh thuế hai lần giữa Việt Nam và Hàn
      Quốc, nên không xác định được tiền lương có được miễn thuế theo hiệp định hay không; cần tra cứu chính
      văn bản hiệp định đó.
    unanswerable: out_of_scope
  - id: q48  # phase 2: answered by 108/2025/QH15 Art 44 cl 2-3 and Art 45 cl 3-4 (fines for misdeclaring imports that cause a tax shortfall); moved to answerable
    question: Doanh nghiệp nhập khẩu bị hải quan phạt vì khai sai mã HS dẫn đến thiếu thuế thì mức phạt tiền là bao nhiêu?
    tax_type: administration
    form: plain
    answer: >
      Khai sai dẫn đến thiếu thuế đối với hàng nhập khẩu bị phạt theo tỷ lệ trên số thuế khai thiếu: 20% nếu
      hải quan phát hiện khi làm thủ tục hoặc khi kiểm tra sau thông quan mà doanh nghiệp tự nguyện nộp đủ số
      thuế; 10% nếu doanh nghiệp tự phát hiện và khai bổ sung sau khi hải quan thông báo kiểm tra trực tiếp hồ
      sơ, hoặc sau 60 ngày kể từ ngày thông quan nhưng trước quyết định kiểm tra sau thông quan. Nếu không tự
      nguyện nộp đủ số thuế thì bị coi là trốn thuế, phạt từ 01 đến 03 lần số thuế trốn. Không bị phạt nếu
      khai bổ sung trước khi hải quan thông báo kiểm tra trực tiếp hồ sơ, hoặc trong 60 ngày kể từ ngày thông
      quan và trước quyết định kiểm tra.
    key_facts:
      - "hải quan phát hiện, doanh nghiệp tự nguyện nộp đủ thuế: phạt 20% số thuế khai thiếu"
      - "tự khai bổ sung sau thông báo kiểm tra hồ sơ hoặc sau 60 ngày kể từ thông quan: phạt 10%"
      - "không tự nguyện nộp đủ thuế: trốn thuế, phạt 01 đến 03 lần số thuế trốn"
      - "khai bổ sung trong 60 ngày kể từ thông quan, trước quyết định kiểm tra: không bị phạt"
    provisions:
      - 108/2025/QH15 Điều 44 khoản 2
      - 108/2025/QH15 Điều 44 khoản 3
      - 108/2025/QH15 Điều 45 khoản 3
      - 108/2025/QH15 Điều 45 khoản 4
  - id: q49  # phase 2: answered in part by 108/2025/QH15 Art 45 cl 4 point c and Art 44 cl 3: not issuing an invoice and not declaring is tax evasion, 1-3 times the tax evaded; the fine for a procedural invoice breach alone is not in the corpus; moved to answerable
    question: Hộ kinh doanh bị cơ quan thuế phát hiện bán hàng không xuất hóa đơn thì bị phạt bao nhiêu tiền?
    tax_type: household
    form: plain
    answer: >
      Nếu bán hàng không lập hóa đơn và không kê khai thuế thì là hành vi trốn thuế, bị phạt từ 01 đến 03 lần
      số thuế trốn (mức phạt không phân biệt tổ chức hay cá nhân), ngoài việc nộp đủ số thuế. Nếu chỉ không lập
      hóa đơn nhưng vẫn kê khai đủ doanh thu thì là vi phạm thủ tục hóa đơn; mức phạt tiền cụ thể cho hành vi
      này không có trong các văn bản của bộ dữ liệu.
    key_facts:
      - "không lập hóa đơn và không kê khai thuế khi bán hàng là hành vi trốn thuế"
      - "phạt từ 01 đến 03 lần số thuế trốn"
      - "mức phạt trốn thuế không phân biệt tổ chức và cá nhân"
      - "nói rõ mức phạt khi chỉ vi phạm thủ tục hóa đơn (vẫn kê khai đủ) không có trong các văn bản"  # review: scores saying what is missing (FR-CORE-012)
    provisions:
      - 108/2025/QH15 Điều 45 khoản 4
      - 108/2025/QH15 Điều 44 khoản 3
      - 108/2025/QH15 Điều 44 khoản 4
  - id: q50
    question: Hộ kinh doanh ở Lào Cai mua hàng của cư dân biên giới Trung Quốc qua cửa khẩu thì được miễn thuế trong định mức bao nhiêu một ngày?
    tax_type: household
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu không quy định định mức miễn thuế cho hàng hóa mua bán, trao đổi của cư dân
      biên giới; định mức này thuộc pháp luật về thuế xuất khẩu, thuế nhập khẩu.
    unanswerable: out_of_scope
  - id: q51
    question: Tiền thuế tiêu thụ đặc biệt thu được thì địa phương được giữ lại bao nhiêu phần trăm, còn lại nộp về trung ương?
    tax_type: sct
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu không quy định tỷ lệ phân chia tiền thuế tiêu thụ đặc biệt giữa ngân sách
      địa phương và trung ương; nội dung này thuộc pháp luật về ngân sách nhà nước.
    unanswerable: out_of_scope
  - id: q52
    question: Tập đoàn mẹ ở Nhật có doanh thu hợp nhất trên 750 triệu euro, vậy công ty con ở Việt Nam có phải nộp thuế bổ sung theo quy định thuế tối thiểu toàn cầu không?
    tax_type: cit
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu không quy định nghĩa vụ nộp thuế thu nhập doanh nghiệp bổ sung theo quy
      định thuế tối thiểu toàn cầu; nội dung này thuộc Nghị quyết 107/2023/QH15 và các văn bản hướng dẫn, không
      có trong bộ dữ liệu.
    unanswerable: out_of_scope
  - id: q53
    question: Tôi có một căn hộ cho thuê ở Melbourne, bên Úc đánh thuế thu nhập từ tiền cho thuê nhà bao nhiêu phần trăm?
    tax_type: pit
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu chỉ gồm luật thuế Việt Nam, không có quy định về thuế thu nhập từ cho thuê
      nhà của Úc.
    unanswerable: out_of_scope
  - id: q54  # phase 2: repealed confirmed, as q11: the lump-sum method ended on 01/01/2026 (Decree 68/2026 Art 17 cl 5; Law 149/2025 Art 1 cl 3)
    question: Nếu thấy mức thuế khoán chi cục thuế áp cho tiệm mình cao quá thì khiếu nại thế nào?
    tax_type: household
    form: plain
    answer: >
      Phương pháp khoán thuế không còn áp dụng từ ngày 01/01/2026: hộ kinh doanh tự kê khai hoặc thông báo
      doanh thu, nên không còn mức thuế khoán do cơ quan thuế ấn định để khiếu nại.
    unanswerable: repealed
  - id: q55
    question: Thuế thu nhập doanh nghiệp tạm nộp theo quý thì hạn nộp tiền là ngày nào?
    tax_type: cit
    form: plain
    answer: >
      Thuế TNDN tạm nộp theo quý phải nộp chậm nhất là ngày cuối cùng của tháng đầu của quý tiếp theo quý phát
      sinh nghĩa vụ thuế.
    key_facts:
      - "ngày cuối cùng của tháng đầu của quý tiếp theo"
    provisions:
      - 252/2026/NĐ-CP Điều 24
  - id: q56
    question: Hộ kinh doanh doanh thu trên 1 tỷ một năm thì có phải giữ sổ sách kế toán như doanh nghiệp không?
    tax_type: household
    form: plain
    answer: >
      Các văn bản không yêu cầu hộ kinh doanh áp dụng chế độ kế toán như doanh nghiệp. Hộ kinh doanh, ở mọi mức
      doanh thu, phải sử dụng sổ kế toán theo pháp luật kế toán và hướng dẫn của Bộ trưởng Bộ Tài chính; chế độ
      kế toán áp dụng cho hộ kinh doanh do Bộ trưởng Bộ Tài chính quy định. Với doanh thu trên 01 tỷ đồng, hộ
      còn phải dùng hóa đơn điện tử.
    key_facts:
      - "sử dụng sổ kế toán theo pháp luật kế toán và hướng dẫn của Bộ trưởng Bộ Tài chính"
      - "chế độ kế toán của hộ kinh doanh do Bộ trưởng Bộ Tài chính quy định"
      - "doanh thu năm trên 01 tỷ đồng phải dùng hóa đơn điện tử"
    provisions:
      - 68/2026/NĐ-CP Điều 13 khoản 5
      - 108/2025/QH15 Điều 13
      - 68/2026/NĐ-CP Điều 8 khoản 5
      - 141/2026/NĐ-CP Điều 1
  - id: q57
    question: Kế toán hạch toán tiền thuế GTGT đầu vào được khấu trừ thì ghi Nợ tài khoản nào, Có tài khoản nào?
    tax_type: vat
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu là văn bản về thuế, không quy định cách hạch toán kế toán (tài khoản ghi Nợ,
      ghi Có); nội dung này thuộc chế độ kế toán doanh nghiệp do Bộ Tài chính ban hành.
    unanswerable: out_of_scope
  - id: q58
    question: Năm 2025 cả nước thu được tổng cộng bao nhiêu tiền thuế giá trị gia tăng?
    tax_type: vat
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu là văn bản pháp luật, không có số liệu thống kê thu ngân sách; số thu thuế
      GTGT năm 2025 cần tra cứu báo cáo thu ngân sách nhà nước.
    unanswerable: out_of_scope
  - id: q59
    question: Hạn chót nộp tờ khai thuế theo tháng là ngày bao nhiêu của tháng sau?
    tax_type: administration
    form: plain
    answer: Hạn nộp hồ sơ khai thuế theo tháng chậm nhất là ngày thứ 20 của tháng tiếp theo tháng phát sinh nghĩa vụ thuế.
    key_facts:
      - "ngày thứ 20 của tháng tiếp theo tháng phát sinh nghĩa vụ thuế"
    provisions:
      - 252/2026/NĐ-CP Điều 10 khoản 2
    added_in: 2
  - id: q60
    question: Công ty mình mới thành lập năm nay thì khai thuế GTGT theo tháng hay theo quý?
    tax_type: administration
    form: plain
    answer: >
      Doanh nghiệp mới bắt đầu hoạt động được chọn khai thuế GTGT theo quý. Sau khi kinh doanh đủ 12 tháng,
      từ năm dương lịch tiếp theo doanh nghiệp căn cứ doanh thu năm trước liền kề: từ 50 tỷ đồng trở xuống thì
      được khai theo quý, trên 50 tỷ đồng thì khai theo tháng; nếu ngay năm mới hoạt động doanh thu đã trên 50 tỷ
      đồng thì khai theo tháng từ năm tiếp theo.
    key_facts:
      - "doanh nghiệp mới bắt đầu hoạt động được lựa chọn khai thuế GTGT theo quý"
      - "doanh thu năm trước liền kề từ 50 tỷ đồng trở xuống: được khai theo quý"
      - "doanh thu năm mới hoạt động trên 50 tỷ đồng: khai theo tháng từ năm tiếp theo"
    provisions:
      - 89/2026/TT-BTC Điều 19 khoản 1
    added_in: 2
  - id: q61
    question: Doanh nghiệp phải nộp hồ sơ quyết toán thuế năm chậm nhất là bao lâu sau khi kết thúc năm tài chính?
    tax_type: administration
    form: plain
    answer: Hồ sơ quyết toán thuế năm nộp chậm nhất là ngày cuối cùng của tháng thứ 03 kể từ ngày kết thúc năm dương lịch hoặc năm tài chính (kỳ quyết toán thuế).
    key_facts:
      - "ngày cuối cùng của tháng thứ 03 kể từ ngày kết thúc kỳ quyết toán thuế"
    provisions:
      - 252/2026/NĐ-CP Điều 10 khoản 5
    added_in: 2
  - id: q62
    question: Công ty chuyển trụ sở sang tỉnh khác thì phải báo thay đổi thông tin đăng ký thuế trong bao nhiêu ngày?
    tax_type: administration
    form: plain
    answer: >
      Doanh nghiệp đăng ký thuế cùng đăng ký kinh doanh theo cơ chế một cửa liên thông thì thông báo thay đổi
      thông tin đăng ký thuế cùng với thủ tục thay đổi nội dung đăng ký doanh nghiệp, theo thời hạn của pháp luật
      về đăng ký doanh nghiệp; người nộp thuế đăng ký thuế trực tiếp với cơ quan thuế thì phải thông báo trong 10
      ngày làm việc kể từ ngày có thay đổi. Khi chuyển trụ sở sang tỉnh khác làm thay đổi cơ quan thuế quản lý,
      doanh nghiệp còn phải nộp đủ các hồ sơ khai thuế đã đến hạn và nộp đủ tiền thuế, tiền chậm nộp, tiền phạt
      với cơ quan thuế nơi đi.
    key_facts:
      - "đăng ký theo cơ chế một cửa liên thông: thông báo cùng với thay đổi nội dung đăng ký doanh nghiệp"
      - "đăng ký thuế trực tiếp với cơ quan thuế: trong 10 ngày làm việc kể từ ngày phát sinh thay đổi"
      - "chuyển sang tỉnh khác: nộp đủ hồ sơ khai thuế đã đến hạn và số thuế còn phải nộp với cơ quan thuế nơi đi"
    provisions:
      - 90/2026/TT-BTC Điều 9
      - 252/2026/NĐ-CP Điều 6 khoản 3
      - 252/2026/NĐ-CP Điều 7 khoản 1
    added_in: 2
  - id: q63
    question: Bây giờ mã số thuế cá nhân có phải là số căn cước công dân luôn không?
    tax_type: administration
    form: plain
    answer: Đúng. Mã số thuế của cá nhân, chủ hộ kinh doanh, cá nhân kinh doanh là số định danh cá nhân được cấp theo pháp luật về căn cước.
    key_facts:
      - "mã số thuế của cá nhân là số định danh cá nhân theo pháp luật về căn cước"
    provisions:
      - 108/2025/QH15 Điều 11 khoản 1
    added_in: 2
  - id: q64
    question: Doanh nghiệp đang tạm ngừng kinh doanh thì trong thời gian tạm ngừng có phải nộp tờ khai thuế không?
    tax_type: administration
    form: plain
    answer: >
      Không. Trong thời gian tạm ngừng hoạt động, kinh doanh, người nộp thuế không phải nộp hồ sơ khai thuế, trừ
      khi tạm ngừng không trọn tháng, quý, năm dương lịch hoặc năm tài chính thì vẫn phải nộp hồ sơ khai thuế tháng,
      quý, hồ sơ quyết toán năm. Trong thời gian tạm ngừng cũng không được sử dụng hóa đơn.
    key_facts:
      - "trong thời gian tạm ngừng không phải nộp hồ sơ khai thuế"
      - "tạm ngừng không trọn tháng, quý, năm thì vẫn phải khai kỳ đó"
      - "không được sử dụng hóa đơn trong thời gian tạm ngừng"
    provisions:
      - 252/2026/NĐ-CP Điều 7 khoản 1
    added_in: 2
  - id: q65  # step 2: Thông tư 90/2026 named in the question covers tax registration, not the dependant dossier; the documents are listed in 87/2026/TT-BTC Điều 4
    question: Theo Thông tư 90/2026, đăng ký người phụ thuộc cho con nhỏ chưa có căn cước thì cần giấy tờ gì?
    tax_type: administration
    form: reference
    answer: >
      Hồ sơ xác định người phụ thuộc là con đẻ gồm bản chụp Giấy khai sinh của con (hoặc bản chụp quyết định
      nhận cha, mẹ, con hoặc văn bản của cơ quan có thẩm quyền xác nhận quan hệ cha mẹ con); bản chụp thẻ Căn cước
      của con chỉ phải nộp khi con đã được cấp Căn cước. Con nuôi cần thêm quyết định công nhận việc nuôi con nuôi;
      con riêng của vợ, chồng cần thêm giấy chứng nhận kết hôn.
    key_facts:
      - "con đẻ: bản chụp Giấy khai sinh của con"
      - "bản chụp thẻ Căn cước chỉ khi con đã được cấp Căn cước"
      - "con nuôi: thêm quyết định công nhận việc nuôi con nuôi"
    provisions:
      - 87/2026/TT-BTC Điều 4
    added_in: 2
  - id: q66  # step 2: moved to unanswerable; the corpus lists what must be done before a tax code ends (invoices, returns, payments, refunds) but says nothing on closing bank accounts or its order
    question: Công ty giải thể thì thủ tục chấm dứt hiệu lực mã số thuế phải làm trước hay sau khi đóng tài khoản ngân hàng?
    tax_type: administration
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu không quy định thứ tự giữa thủ tục chấm dứt hiệu lực mã số thuế và việc đóng tài
      khoản ngân hàng; chúng chỉ quy định các nghĩa vụ phải hoàn thành trước khi chấm dứt hiệu lực mã số thuế. Việc
      đóng tài khoản thuộc pháp luật về ngân hàng và doanh nghiệp.
    unanswerable: out_of_scope
    added_in: 2
  - id: q67
    question: Doanh nghiệp nợ thuế quá 90 ngày thì cơ quan thuế được áp dụng những biện pháp cưỡng chế nào?
    tax_type: administration
    form: plain
    answer: >
      Doanh nghiệp có tiền thuế nợ quá 90 ngày kể từ ngày hết thời hạn nộp thuộc diện bị cưỡng chế. Các biện pháp
      cưỡng chế gồm: trích tiền từ tài khoản, phong tỏa tài khoản; khấu trừ một phần tiền lương hoặc thu nhập; dừng
      làm thủ tục hải quan; ngừng sử dụng hóa đơn; thu tiền, tài sản do bên khác nắm giữ; kê biên, bán đấu giá tài
      sản; nộp đơn yêu cầu phá sản; thu hồi giấy chứng nhận đăng ký doanh nghiệp, giấy phép.
    key_facts:
      - "nợ thuế quá 90 ngày kể từ ngày hết thời hạn nộp thì bị cưỡng chế"
      - "trích tiền từ tài khoản, phong tỏa tài khoản"
      - "dừng làm thủ tục hải quan; ngừng sử dụng hóa đơn"
      - "kê biên, bán đấu giá tài sản; thu hồi giấy chứng nhận đăng ký doanh nghiệp"
    provisions:
      - 108/2025/QH15 Điều 48
      - 108/2025/QH15 Điều 49
    added_in: 2
  - id: q68
    question: Công ty còn nợ thuế thì giám đốc có bị tạm hoãn xuất cảnh không?
    tax_type: administration
    form: plain
    answer: >
      Có thể. Người đại diện theo pháp luật (hoặc chủ sở hữu hưởng lợi) của doanh nghiệp bị tạm hoãn xuất cảnh khi
      doanh nghiệp thuộc diện bị cưỡng chế, có số tiền thuế nợ từ 500 triệu đồng trở lên và đã quá hạn nộp từ 120
      ngày trở lên; hoặc khi doanh nghiệp bị thông báo không hoạt động tại địa chỉ đăng ký mà sau 120 ngày không
      khôi phục hoặc chấm dứt hiệu lực mã số thuế.
    key_facts:
      - "doanh nghiệp thuộc diện bị cưỡng chế"
      - "tiền thuế nợ từ 500 triệu đồng trở lên"
      - "quá thời hạn nộp từ 120 ngày trở lên"
    provisions:
      - 252/2026/NĐ-CP Điều 28 khoản 1
    added_in: 2
  - id: q69
    question: Tiền thuế nợ trong trường hợp nào thì được xóa nợ?
    tax_type: administration
    form: plain
    answer: >
      Tiền thuế nợ được xóa khi: cá nhân đã chết, bị tuyên bố đã chết hoặc mất năng lực hành vi dân sự mà không có tài
      sản (kể cả tài sản thừa kế); doanh nghiệp, hợp tác xã bị tuyên bố phá sản, đã thanh toán nợ mà không còn tài sản;
      người nộp thuế đã bị cưỡng chế bằng thu hồi giấy chứng nhận đăng ký, giấy phép mà khoản nợ quá 10 năm kể từ hạn
      nộp nhưng không có khả năng thu hồi; hoặc bị ảnh hưởng bởi thiên tai, thảm họa, dịch bệnh diện rộng, đã được
      miễn tiền chậm nộp và gia hạn mà vẫn không phục hồi được sản xuất, kinh doanh.
    key_facts:
      - "cá nhân đã chết hoặc mất năng lực hành vi dân sự không có tài sản"
      - "doanh nghiệp bị tuyên bố phá sản, không còn tài sản"
      - "đã bị thu hồi giấy chứng nhận đăng ký và nợ quá 10 năm không có khả năng thu hồi"
      - "ảnh hưởng thiên tai, dịch bệnh diện rộng, đã được miễn tiền chậm nộp và gia hạn"
    provisions:
      - 108/2025/QH15 Điều 21 khoản 1
    added_in: 2
  - id: q70
    question: Xưởng bị cháy, thiệt hại nặng nên nộp thuế chậm thì có được miễn tiền chậm nộp không?
    tax_type: administration
    form: plain
    answer: >
      Có. Hỏa hoạn gây thiệt hại vật chất là trường hợp bất khả kháng, người nộp thuế được miễn tiền chậm nộp. Hồ sơ
      gồm văn bản đề nghị theo mẫu 01/MTCN, tài liệu của cơ quan có thẩm quyền xác nhận thời gian, địa điểm xảy ra
      hỏa hoạn, và văn bản xác định giá trị thiệt hại của cơ quan tài chính hoặc giám định độc lập.
    key_facts:
      - "hỏa hoạn gây thiệt hại vật chất là trường hợp bất khả kháng"
      - "được miễn tiền chậm nộp"
      - "cần xác nhận của cơ quan có thẩm quyền về hỏa hoạn và văn bản xác định giá trị thiệt hại"
    provisions:
      - 108/2025/QH15 Điều 4
      - 108/2025/QH15 Điều 16 khoản 5
      - 89/2026/TT-BTC Điều 41 khoản 2
    added_in: 2
  - id: q71
    question: Theo Luật Quản lý thuế 108/2025, cơ quan thuế được tự ấn định số thuế phải nộp trong những trường hợp nào?
    tax_type: administration
    form: reference
    answer: >
      Cơ quan thuế ấn định thuế khi người nộp thuế: không đăng ký thuế, không khai thuế, không nộp bổ sung hồ sơ theo
      yêu cầu hoặc khai không đầy đủ, trung thực về căn cứ tính thuế; có hồ sơ nhưng không xác định được hoặc không tự
      tính được số thuế; không phản ánh đúng số liệu trên sổ kế toán; không xuất trình sổ sách, hóa đơn, chứng từ đúng
      hạn; không chấp hành quyết định kiểm tra; mua bán, kê khai không đúng giá thực tế hoặc giá giao dịch thông
      thường; dùng hóa đơn, chứng từ không hợp pháp; và các trường hợp khác theo Điều 24.
    key_facts:
      - "không đăng ký thuế, không khai thuế hoặc khai không đầy đủ, trung thực"
      - "không xuất trình sổ kế toán, hóa đơn, chứng từ trong thời hạn quy định"
      - "không chấp hành quyết định kiểm tra thuế"
      - "kê khai không đúng giá thực tế thanh toán hoặc giá giao dịch thông thường"
    provisions:
      - 108/2025/QH15 Điều 24 khoản 2
    added_in: 2
  - id: q72  # step 2: Nghị định 252/2026 named in the question leaves the number of instalments to the Minister of Finance (Điều 65 khoản 2); the 12-month limit is in 108/2025/QH15 Điều 48 khoản 6
    question: Theo Nghị định 252/2026, tiền thuế nợ được nộp dần trong tối đa bao nhiêu tháng?
    tax_type: administration
    form: reference
    answer: >
      Tiền thuế nợ được nộp dần trong thời hạn không quá 12 tháng kể từ ngày cơ quan có thẩm quyền chấp nhận, và phải
      có bảo lãnh của tổ chức tín dụng. Nghị định 252/2026 giao Bộ trưởng Bộ Tài chính quy định số lần nộp dần và hồ sơ,
      thủ tục.
    key_facts:
      - "không quá 12 tháng kể từ ngày có văn bản chấp nhận nộp dần"
      - "phải có bảo lãnh của tổ chức tín dụng"
    provisions:
      - 108/2025/QH15 Điều 48 khoản 6
      - 252/2026/NĐ-CP Điều 65
    added_in: 2
  - id: q73
    question: Theo Thông tư 89/2026, hồ sơ đề nghị miễn tiền chậm nộp gồm những giấy tờ gì?
    tax_type: administration
    form: reference
    answer: >
      Với trường hợp do thiên tai, thảm họa, dịch bệnh, hỏa hoạn, tai nạn bất ngờ, hồ sơ miễn tiền chậm nộp gồm: văn
      bản đề nghị theo mẫu số 01/MTCN; bản chính hoặc bản sao chứng thực tài liệu của cơ quan có thẩm quyền xác nhận
      thời gian, địa điểm xảy ra sự kiện; văn bản xác định giá trị thiệt hại vật chất của cơ quan tài chính hoặc cơ
      quan giám định độc lập; và văn bản, chứng từ về bồi thường thiệt hại (nếu có). Hồ sơ đủ thì cơ quan thuế giải
      quyết trong 07 ngày làm việc.
    key_facts:
      - "văn bản đề nghị miễn tiền chậm nộp mẫu số 01/MTCN"
      - "tài liệu của cơ quan có thẩm quyền xác nhận thời gian, địa điểm xảy ra sự kiện"
      - "văn bản xác định giá trị thiệt hại của cơ quan tài chính hoặc giám định độc lập"
      - "giải quyết trong 07 ngày làm việc kể từ ngày tiếp nhận hồ sơ đầy đủ"
    provisions:
      - 89/2026/TT-BTC Điều 41
    added_in: 2
  - id: q74  # step 2: the corpus has no rule on a tax inspection (thanh tra); Law 108/2025 regulates the on-site tax check (kiểm tra thuế), which the answer gives
    question: Một cuộc thanh tra thuế tại trụ sở doanh nghiệp kéo dài tối đa bao nhiêu ngày?
    tax_type: administration
    form: plain
    answer: >
      Luật Quản lý thuế 108/2025 quy định kiểm tra thuế tại trụ sở người nộp thuế: không quá 20 ngày kể từ ngày công
      bố quyết định kiểm tra, gia hạn 01 lần không quá 20 ngày; với doanh nghiệp có giao dịch liên kết không quá 40
      ngày, gia hạn 01 lần không quá 40 ngày; nếu cần trao đổi thông tin với cơ quan thuế nước ngoài có thể kéo dài
      nhưng không quá 02 năm. Thời gian tạm dừng kiểm tra không tính vào thời hạn.
    key_facts:
      - "không quá 20 ngày kể từ ngày công bố quyết định kiểm tra, gia hạn 01 lần không quá 20 ngày"
      - "doanh nghiệp có giao dịch liên kết: không quá 40 ngày, gia hạn 01 lần không quá 40 ngày"
      - "cần thông tin từ cơ quan thuế nước ngoài: không quá 02 năm"
    provisions:
      - 108/2025/QH15 Điều 22 khoản 3
    added_in: 2
  - id: q75
    question: Cơ quan thuế xuống kiểm tra tại trụ sở công ty thì phải báo trước cho công ty bao lâu?
    tax_type: administration
    form: plain
    answer: >
      Quyết định kiểm tra thuế phải gửi cho người nộp thuế trong 03 ngày làm việc kể từ ngày ký, và được công bố
      trong 10 ngày làm việc kể từ ngày ban hành.
    key_facts:
      - "gửi quyết định kiểm tra trong 03 ngày làm việc kể từ ngày ký"
      - "công bố quyết định kiểm tra trong 10 ngày làm việc kể từ ngày ban hành"
    provisions:
      - 89/2026/TT-BTC Điều 88 khoản 7
    added_in: 2
  - id: q76
    question: Trường hợp nào hồ sơ hoàn thuế bị kiểm tra trước rồi mới được hoàn?
    tax_type: administration
    form: plain
    answer: >
      Cơ quan thuế kiểm tra trước, hoàn thuế sau đối với: hồ sơ hoàn thuế lần đầu của từng dự án đầu tư, từng trường
      hợp hoàn thuế; hồ sơ đề nghị hoàn trong 02 năm kể từ khi bị xử lý về hành vi trốn thuế; hồ sơ hoặc số tiền đề
      nghị hoàn được xác định có rủi ro cao; và hồ sơ hoàn thuế của doanh nghiệp, tổ chức khi giải thể, phá sản.
    key_facts:
      - "hoàn thuế lần đầu theo từng dự án, từng trường hợp hoàn thuế"
      - "đề nghị hoàn trong 02 năm kể từ khi bị xử lý về trốn thuế"
      - "hồ sơ có rủi ro cao"
      - "doanh nghiệp giải thể, phá sản"
    provisions:
      - 252/2026/NĐ-CP Điều 30 khoản 1
    added_in: 2
  - id: q77
    question: Nếu doanh nghiệp khai thiếu thuế do sai sót, không có hành vi trốn thuế, cơ quan thuế có thể truy thu các kỳ tính thuế cách đây tối đa bao nhiêu năm?
    tax_type: administration
    form: plain
    answer: >
      Khai sai dẫn đến thiếu thuế có thời hiệu xử phạt 05 năm; quá thời hiệu thì không bị phạt nhưng vẫn phải nộp
      đủ số tiền thuế thiếu và tiền chậm nộp trong thời hạn 10 năm trở về trước kể từ ngày phát hiện vi phạm. Nếu không
      đăng ký thuế thì phải nộp cho toàn bộ thời gian trở về trước.
    key_facts:
      - "truy thu số thuế thiếu và tiền chậm nộp trong 10 năm trở về trước kể từ ngày phát hiện"
      - "thời hiệu xử phạt hành vi khai sai dẫn đến thiếu thuế là 05 năm"
      - "không đăng ký thuế: truy thu toàn bộ thời gian trở về trước"
    provisions:
      - 108/2025/QH15 Điều 44 khoản 7
      - 108/2025/QH15 Điều 44 khoản 8
    added_in: 2
  - id: q78
    question: Công ty đã lập lệnh chuyển tiền thuế đúng hạn nhưng ngân hàng chuyển trễ thì công ty có bị tính tiền chậm nộp không?
    tax_type: administration
    form: plain
    answer: >
      Không, nếu ngân hàng đã trích tiền đúng hạn: khi nộp điện tử, ngày nộp thuế là ngày ngân hàng trích tiền từ tài
      khoản của người nộp thuế và được ghi trên chứng từ nộp tiền. Ngân hàng phải chuyển tiền vào tài khoản Kho bạc
      ngay trong ngày giao dịch (chậm nhất trước 10 giờ ngày giao dịch tiếp theo); nếu chậm chuyển do lỗi của ngân
      hàng thì ngân hàng phải trả tiền lãi chậm chuyển.
    key_facts:
      - "ngày nộp thuế là ngày trích tiền từ tài khoản, ghi trên chứng từ nộp tiền"
      - "ngân hàng chuyển trong ngày giao dịch, chậm nhất trước 10 giờ ngày giao dịch tiếp theo"
      - "chậm chuyển do lỗi ngân hàng thì ngân hàng trả tiền lãi chậm chuyển"
    provisions:
      - 108/2025/QH15 Điều 14 khoản 5
      - 252/2026/NĐ-CP Điều 61 khoản 1
    added_in: 2
  - id: q79
    question: Hóa đơn điện tử đã gửi khách mà ghi sai tên công ty người mua thì sửa bằng cách nào?
    tax_type: administration
    form: plain
    answer: >
      Nếu chỉ sai tên (hoặc địa chỉ) người mua mà mã số thuế, số tiền, thuế suất, tiền thuế và hàng hóa đều đúng, người
      bán thông báo cho người mua và không phải lập lại hóa đơn, đồng thời thông báo cho cơ quan thuế theo Mẫu số
      04/SS-HĐĐT. Nếu sai mã số thuế hay các nội dung về tiền, thuế suất, hàng hóa thì lập hóa đơn điều chỉnh hoặc
      hóa đơn thay thế.
    key_facts:
      - "sai tên, địa chỉ nhưng đúng mã số thuế và số tiền: không phải lập lại hóa đơn"
      - "thông báo cho người mua và thông báo cơ quan thuế theo Mẫu số 04/SS-HĐĐT"
      - "sai mã số thuế, số tiền, thuế suất: lập hóa đơn điều chỉnh hoặc thay thế"
    provisions:
      - 91/2026/TT-BTC Điều 10 khoản 1
    added_in: 2
  - id: q80
    question: Khách trả lại hàng sau khi đã xuất hóa đơn điện tử thì bên bán phải làm gì với hóa đơn đó?
    tax_type: administration
    form: plain
    answer: >
      Khi người mua trả lại toàn bộ hoặc một phần hàng hóa, người bán lập hóa đơn điều chỉnh; nếu hai bên thỏa thuận
      để người mua lập hóa đơn khi trả lại hàng thì người mua lập hóa đơn điện tử giao cho người bán.
    key_facts:
      - "người bán lập hóa đơn điều chỉnh"
      - "nếu có thỏa thuận thì người mua lập hóa đơn trả lại hàng giao cho người bán"
    provisions:
      - 91/2026/TT-BTC Điều 10 khoản 5
    added_in: 2
  - id: q81
    question: Doanh nghiệp nào được dùng hóa đơn điện tử không có mã của cơ quan thuế?
    tax_type: administration
    form: plain
    answer: >
      Doanh nghiệp kinh doanh trong các lĩnh vực điện lực, xăng dầu, bưu chính, viễn thông, nước sạch, tài chính ngân
      hàng, chứng khoán, bảo hiểm, y tế, thương mại điện tử, siêu thị, thương mại, vận tải… và tổ chức kinh tế đã hoặc
      sẽ giao dịch điện tử với cơ quan thuế, có phần mềm kế toán, phần mềm lập hóa đơn đáp ứng lập, tra cứu, lưu trữ
      và truyền dữ liệu hóa đơn đến người mua và cơ quan thuế thì được dùng hóa đơn điện tử không có mã, trừ trường hợp
      rủi ro cao về thuế.
    key_facts:
      - "thuộc các lĩnh vực như điện lực, xăng dầu, viễn thông, ngân hàng, bảo hiểm, thương mại điện tử"
      - "có phần mềm kế toán, phần mềm lập hóa đơn và bảo đảm truyền dữ liệu đến người mua và cơ quan thuế"
      - "không áp dụng cho trường hợp rủi ro cao về thuế"
    provisions:
      - 254/2026/NĐ-CP Điều 6 khoản 1
    added_in: 2
  - id: q82
    question: Theo Nghị định 254/2026, quán ăn bán cho khách lẻ không lấy hóa đơn thì có phải lập hóa đơn không?
    tax_type: administration
    form: reference
    answer: >
      Có. Khi bán hàng hóa, dịch vụ, người bán phải lập hóa đơn điện tử giao cho người mua, trừ các trường hợp không phải
      dùng hóa đơn theo Điều 7, và quán ăn không thuộc các trường hợp đó. Kinh doanh ăn uống bán trực tiếp cho người
      tiêu dùng sử dụng hóa đơn điện tử từ máy tính tiền.
    key_facts:
      - "bán hàng hóa, dịch vụ phải lập hóa đơn điện tử giao cho người mua"
      - "ăn uống bán trực tiếp cho người tiêu dùng dùng hóa đơn điện tử từ máy tính tiền"
    provisions:
      - 254/2026/NĐ-CP Điều 4 khoản 1
      - 254/2026/NĐ-CP Điều 6 khoản 1
    added_in: 2
  - id: q83
    question: Chứng từ khấu trừ thuế thu nhập cá nhân cấp cho nhân viên bây giờ bắt buộc làm bản điện tử hay vẫn in giấy được?
    tax_type: administration
    form: plain
    answer: >
      Bắt buộc bản điện tử: tổ chức khấu trừ thuế TNCN phải lập chứng từ khấu trừ thuế điện tử giao cho người bị khấu
      trừ, theo định dạng chuẩn dữ liệu. Với nhân viên ký hợp đồng từ 03 tháng trở lên, công ty chỉ lập một chứng từ
      khấu trừ trong một năm tính thuế; nếu nhân viên ủy quyền quyết toán thì không phải lập chứng từ.
    key_facts:
      - "phải lập chứng từ khấu trừ thuế TNCN điện tử"
      - "hợp đồng từ 03 tháng trở lên: một chứng từ cho một năm tính thuế"
      - "cá nhân ủy quyền quyết toán: không phải lập chứng từ khấu trừ"
    provisions:
      - 254/2026/NĐ-CP Điều 4 khoản 2
      - 254/2026/NĐ-CP Điều 24
    added_in: 2
  - id: q84  # step 2: Thông tư 91/2026 named in the question sets no retention period; 254/2026/NĐ-CP Điều 5 refers it to the accounting law, which is not in the corpus
    question: Thông tư 91/2026 yêu cầu doanh nghiệp lưu trữ hóa đơn điện tử trong bao lâu?
    tax_type: administration
    form: reference
    answer: >
      Thông tư 91/2026 không đặt thời hạn riêng. Theo Nghị định 254/2026, hóa đơn điện tử được lưu trữ đúng và đủ thời
      hạn theo pháp luật kế toán, dưới dạng thông điệp dữ liệu, bảo đảm an toàn, toàn vẹn, không bị sửa đổi và sẵn
      sàng in ra giấy hoặc tra cứu khi có yêu cầu. Số năm cụ thể thuộc pháp luật kế toán, không có trong bộ dữ liệu.
    key_facts:
      - "lưu trữ đúng và đủ thời hạn theo pháp luật kế toán"
      - "lưu trữ dưới dạng thông điệp dữ liệu, sẵn sàng in ra giấy hoặc tra cứu"
    provisions:
      - 254/2026/NĐ-CP Điều 5
    added_in: 2
  - id: q85
    question: Công ty mẹ nắm bao nhiêu phần trăm vốn của công ty con thì hai bên bị coi là có quan hệ liên kết?
    tax_type: administration
    form: plain
    answer: Hai doanh nghiệp có quan hệ liên kết khi một doanh nghiệp nắm giữ trực tiếp hoặc gián tiếp ít nhất 25% vốn góp của chủ sở hữu của doanh nghiệp kia.
    key_facts:
      - "nắm giữ trực tiếp hoặc gián tiếp ít nhất 25% vốn góp của chủ sở hữu"
    provisions:
      - 255/2026/NĐ-CP Điều 5 khoản 2
    added_in: 2
  - id: q86
    question: Doanh nghiệp có giao dịch liên kết nhưng doanh thu nhỏ thì có được miễn lập hồ sơ xác định giá giao dịch liên kết không?
    tax_type: administration
    form: plain
    answer: >
      Có, nếu tổng doanh thu của kỳ tính thuế dưới 50 tỷ đồng và tổng giá trị các giao dịch liên kết trong kỳ dưới 30
      tỷ đồng thì được miễn lập Hồ sơ xác định giá giao dịch liên kết, nhưng vẫn phải kê khai thông tin giao dịch liên
      kết theo Phụ lục I của Nghị định 255/2026.
    key_facts:
      - "tổng doanh thu kỳ tính thuế dưới 50 tỷ đồng"
      - "tổng giá trị giao dịch liên kết dưới 30 tỷ đồng"
      - "vẫn phải kê khai theo Phụ lục I"
    provisions:
      - 255/2026/NĐ-CP Điều 20 khoản 2
    added_in: 2
  - id: q87
    question: Theo Nghị định 255/2026, khi cơ quan thuế yêu cầu thì doanh nghiệp có bao nhiêu ngày để nộp hồ sơ xác định giá giao dịch liên kết?
    tax_type: administration
    form: reference
    answer: >
      Thời hạn cung cấp Hồ sơ xác định giá giao dịch liên kết không quá 30 ngày làm việc kể từ khi nhận văn bản yêu cầu
      của cơ quan thuế; có lý do chính đáng thì được gia hạn 01 lần không quá 15 ngày làm việc.
    key_facts:
      - "không quá 30 ngày làm việc kể từ khi nhận văn bản yêu cầu"
      - "gia hạn 01 lần không quá 15 ngày làm việc"
    provisions:
      - 255/2026/NĐ-CP Điều 18 khoản 4
    added_in: 2
  - id: q88
    question: Theo Thông tư 94/2026, doanh nghiệp bị xếp vào nhóm rủi ro cao thì hồ sơ hoàn thuế có phải kiểm tra trước khi hoàn không?
    tax_type: administration
    form: reference
    answer: >
      Có. Người nộp thuế có hồ sơ hoàn thuế GTGT bị phân loại rủi ro cao thì bị kiểm tra trước, hoàn thuế sau (trừ
      trường hợp hồ sơ liền kề trước đó đã kiểm tra không phát hiện khai sai và không thuộc nhóm rủi ro cao chấm điểm
      khác thì được hoàn trước, kiểm tra sau). Với các hồ sơ hoàn thuế khác, rủi ro cao cũng kiểm tra trước, hoàn sau;
      rủi ro trung bình và thấp được hoàn trước, kiểm tra sau.
    key_facts:
      - "rủi ro cao: kiểm tra trước, hoàn thuế sau"
      - "rủi ro trung bình và thấp: hoàn thuế trước, kiểm tra sau"
    provisions:
      - 94/2026/TT-BTC Điều 16
    added_in: 2
  - id: q89  # step 2: moved to unanswerable; the corpus sends the payment deadline of guaranteed import duty to the Law on Export and Import Duties (108/2025/QH15 Điều 14 khoản 1), which is not in the corpus
    question: Nếu khoản thuế nhập khẩu được ngân hàng bảo lãnh thì doanh nghiệp phải nộp thuế chậm nhất sau bao nhiêu ngày?
    tax_type: administration
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu không quy định thời hạn nộp thuế nhập khẩu khi có bảo lãnh; thời hạn nộp thuế đối với
      hàng hóa xuất khẩu, nhập khẩu thực hiện theo Luật Thuế xuất khẩu, thuế nhập khẩu, không có trong bộ dữ liệu.
    unanswerable: out_of_scope
    added_in: 2
  - id: q90
    question: Theo Thông tư 86/2026, doanh nghiệp nhập nguyên liệu về sản xuất hàng xuất khẩu thì khi nào được hoàn thuế nhập khẩu đã nộp?
    tax_type: administration
    form: reference
    answer: >
      Được hoàn thuế nhập khẩu khi sản phẩm sản xuất từ nguyên liệu, vật tư, linh kiện nhập khẩu đã thực tế xuất khẩu;
      số thuế được hoàn tương ứng với lượng, chủng loại nguyên liệu thực tế dùng để sản xuất sản phẩm đã xuất khẩu.
      Doanh nghiệp phải có cơ sở sản xuất tại Việt Nam và quyền sở hữu hoặc quyền sử dụng máy móc, thiết bị phù hợp;
      hồ sơ gồm công văn đề nghị hoàn, hợp đồng và hóa đơn xuất khẩu, nhập khẩu, chứng từ thanh toán và báo cáo tính thuế
      nguyên liệu nhập khẩu theo Mẫu số 15.
    key_facts:
      - "sản phẩm đã thực tế xuất khẩu"
      - "số thuế hoàn tương ứng với nguyên liệu thực tế dùng để sản xuất sản phẩm đã xuất khẩu"
      - "có cơ sở sản xuất tại Việt Nam và máy móc, thiết bị phù hợp"
      - "báo cáo tính thuế nguyên liệu, vật tư, linh kiện nhập khẩu theo Mẫu số 15"
    provisions:
      - 86/2026/TT-BTC Điều 11 khoản 1
    added_in: 2
  - id: q91
    question: Hàng nhập khẩu đã thông quan rồi mới phát hiện khai sai thì còn được khai bổ sung trong bao lâu?
    tax_type: administration
    form: plain
    answer: >
      Thời hạn khai bổ sung hàng xuất nhập khẩu theo pháp luật hải quan. Về xử phạt: khai bổ sung trong 60 ngày kể từ
      ngày thông quan và trước khi có quyết định thanh tra, kiểm tra thì không bị phạt; khai bổ sung sau 60 ngày nhưng
      trước khi có quyết định kiểm tra sau thông quan, thanh tra, kiểm tra thì bị phạt 10% số thuế khai thiếu, ngoài
      việc nộp đủ thuế và tiền chậm nộp.
    key_facts:
      - "khai bổ sung trong 60 ngày kể từ ngày thông quan, trước quyết định kiểm tra: không bị phạt"
      - "sau 60 ngày, trước quyết định kiểm tra sau thông quan: phạt 10% số thuế khai thiếu"
      - "vẫn phải nộp đủ tiền thuế và tiền chậm nộp"
    provisions:
      - 108/2025/QH15 Điều 44 khoản 2
      - 108/2025/QH15 Điều 44 khoản 3
      - 108/2025/QH15 Điều 45 khoản 3
    added_in: 2
  - id: q92
    question: Mình nộp thuế qua app ngân hàng thì ngày nào được tính là ngày đã nộp thuế?
    tax_type: administration
    form: plain
    answer: Nộp theo phương thức điện tử thì ngày nộp thuế là ngày ngân hàng hoặc tổ chức thanh toán trích tiền từ tài khoản của người nộp thuế và được ghi trên chứng từ nộp tiền.
    key_facts:
      - "ngày trích tiền từ tài khoản của người nộp thuế, ghi trên chứng từ nộp tiền"
    provisions:
      - 108/2025/QH15 Điều 14 khoản 5
    added_in: 2
  - id: q93
    question: Theo Luật 108/2025, nhà cung cấp nước ngoài không có cơ sở thường trú tại Việt Nam bán dịch vụ cho doanh nghiệp Việt Nam thì bên nào phải khai và nộp thuế?
    tax_type: administration
    form: reference
    answer: >
      Theo Luật 108/2025, tổ chức nước ngoài kinh doanh trên nền tảng thương mại điện tử, nền tảng số và các dịch vụ
      khác trực tiếp hoặc ủy quyền khai, nộp thuế tại Việt Nam, trừ trường hợp thuộc diện khấu trừ, nộp thay. Doanh
      nghiệp Việt Nam nộp thuế GTGT theo phương pháp khấu trừ khi mua dịch vụ của nhà cung cấp nước ngoài phải khấu
      trừ, nộp thay thuế GTGT và thuế TNDN của nhà cung cấp đó; số thuế đã được khấu trừ, nộp thay thì nhà cung cấp
      không phải nộp nữa.
    key_facts:
      - "nhà cung cấp nước ngoài trực tiếp hoặc ủy quyền khai, nộp thuế tại Việt Nam"
      - "doanh nghiệp Việt Nam nộp GTGT theo phương pháp khấu trừ phải khấu trừ, nộp thay thuế GTGT và TNDN"
      - "số thuế đã được khấu trừ, nộp thay thì người nộp thuế không phải nộp"
    provisions:
      - 108/2025/QH15 Điều 12 khoản 2
      - 108/2025/QH15 Điều 12 khoản 3
      - 252/2026/NĐ-CP Điều 43 khoản 3
    added_in: 2
  - id: q94
    question: Kế toán lập hóa đơn điện tử sai thời điểm thì công ty bị phạt bao nhiêu tiền?
    tax_type: administration
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu không quy định mức phạt tiền cụ thể cho hành vi lập hóa đơn sai thời điểm; mức phạt
      vi phạm về hóa đơn thuộc nghị định xử phạt vi phạm hành chính về thuế, hóa đơn, không có trong bộ dữ liệu.
    unanswerable: out_of_scope
    added_in: 2
  - id: q95
    question: Thi chứng chỉ hành nghề dịch vụ làm thủ tục về thuế gồm mấy môn và điểm đạt là bao nhiêu?
    tax_type: administration
    form: plain
    answer: >
      Các văn bản trong bộ dữ liệu không quy định nội dung, số môn hay điểm đạt của kỳ thi chứng chỉ hành nghề dịch vụ
      làm thủ tục về thuế; nội dung này thuộc văn bản riêng của Bộ Tài chính về thi chứng chỉ.
    unanswerable: out_of_scope
    added_in: 2
  - id: q96
    question: Chi cục thuế khu vực quản lý quận Bình Thạnh bây giờ đặt trụ sở ở đâu?
    tax_type: administration
    form: plain
    answer: Các văn bản trong bộ dữ liệu là văn bản pháp luật về thuế, không có thông tin về trụ sở của cơ quan thuế quản lý từng địa bàn.
    unanswerable: out_of_scope
    added_in: 2
  - id: q97
    question: Hiện nay cả nước còn tổng cộng bao nhiêu tiền nợ thuế chưa thu được?
    tax_type: administration
    form: plain
    answer: Các văn bản trong bộ dữ liệu là văn bản pháp luật, không có số liệu thống kê về tổng số tiền nợ thuế của cả nước.
    unanswerable: out_of_scope
    added_in: 2
  - id: q98
    question: Phần mềm hỗ trợ kê khai HTKK bản mới nhất là phiên bản nào?
    tax_type: administration
    form: plain
    answer: Các văn bản trong bộ dữ liệu không có thông tin về phiên bản phần mềm hỗ trợ kê khai HTKK.
    unanswerable: out_of_scope
    added_in: 2
  - id: q99
    question: Theo Thông tư 156/2013, hồ sơ khai bổ sung thuế gồm những gì?
    tax_type: administration
    form: reference
    answer: >
      Thông tư 156/2013/TT-BTC không còn hiệu lực nên không áp dụng. Việc khai bổ sung hiện theo Luật Quản lý thuế
      108/2025/QH15 và Nghị định 252/2026/NĐ-CP: được khai bổ sung trong 05 năm kể từ hạn nộp hồ sơ của kỳ có sai sót,
      trước khi có quyết định thanh tra, kiểm tra.
    unanswerable: repealed
    added_in: 2
  - id: q100  # step 2: repealed confirmed by 89/2026/TT-BTC Điều 99 khoản 3, which repeals 80/2021/TT-BTC
    question: Theo Thông tư 80/2021, tờ khai thuế GTGT theo phương pháp khấu trừ là mẫu số mấy?
    tax_type: administration
    form: reference
    answer: >
      Thông tư 80/2021/TT-BTC đã bị bãi bỏ bởi Thông tư 89/2026/TT-BTC nên mẫu tờ khai theo thông tư đó không còn áp
      dụng; mẫu tờ khai hiện hành nằm trong phụ lục của Thông tư 89/2026/TT-BTC.
    unanswerable: repealed
    added_in: 2
  - id: q101
    question: Công ty mình bán phần mềm máy tính tự viết thì có phải chịu thuế GTGT không?
    tax_type: vat
    form: plain
    answer: Không. Sản phẩm phần mềm và dịch vụ phần mềm theo quy định của pháp luật thuộc đối tượng không chịu thuế GTGT.
    key_facts:
      - "sản phẩm phần mềm, dịch vụ phần mềm không chịu thuế GTGT"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 21
      - 181/2025/NĐ-CP Điều 4 khoản 13
    added_in: 2
  - id: q102
    question: Trung tâm dạy tiếng Anh cho trẻ em thu học phí thì có phải tính thuế GTGT không?
    tax_type: vat
    form: plain
    answer: >
      Không, nếu là hoạt động dạy học theo quy định của pháp luật về giáo dục: hoạt động dạy học, dạy nghề theo pháp luật
      về giáo dục, giáo dục nghề nghiệp thuộc đối tượng không chịu thuế GTGT, kể cả các khoản thu hộ, chi hộ của cơ sở dạy
      học. Hàng hóa, dịch vụ do bên khác cung cấp cho cơ sở dạy học vẫn chịu thuế.
    key_facts:
      - "dạy học, dạy nghề theo pháp luật về giáo dục không chịu thuế GTGT"
      - "khoản thu hộ, chi hộ của cơ sở dạy học cũng không chịu thuế"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 13
      - 181/2025/NĐ-CP Điều 4 khoản 7
    added_in: 2
  - id: q103  # step 2: 48/2024 Điều 9 carries the outside-corpus warning (Law 90/2025 amends point a cl 1, exports); the answer uses cl 2 and 3, which it does not touch; 149/2025 Điều 1 listed because it amends Điều 9 khoản 5 of the same article
    question: Công ty cho người dân thuê căn hộ để ở thì tiền thuê có chịu thuế GTGT không?
    tax_type: vat
    form: plain
    answer: >
      Có. Cho thuê căn hộ để ở không thuộc các đối tượng không chịu thuế GTGT, nên tiền thuê chịu thuế GTGT với giá tính
      thuế là số tiền cho thuê chưa có thuế. Thuế suất là 10%; riêng bán, cho thuê, cho thuê mua nhà ở xã hội theo Luật
      Nhà ở áp dụng 5%.
    key_facts:
      - "cho thuê nhà ở không thuộc đối tượng không chịu thuế GTGT"
      - "giá tính thuế là số tiền cho thuê chưa có thuế GTGT"
      - "thuế suất 10%; nhà ở xã hội 5%"
    provisions:
      - 48/2024/QH15 Điều 7 khoản 1
      - 48/2024/QH15 Điều 9 khoản 2
      - 48/2024/QH15 Điều 9 khoản 3
      - 149/2025/QH15 Điều 1
    added_in: 2
  - id: q104
    question: Doanh nghiệp bán nhà ở dự án thì khi tính thuế GTGT có được trừ tiền sử dụng đất ra không?
    tax_type: vat
    form: plain
    answer: Có. Với kinh doanh bất động sản, giá tính thuế GTGT là giá bán chưa có thuế trừ tiền sử dụng đất hoặc tiền thuê đất nộp ngân sách nhà nước (giá đất được trừ).
    key_facts:
      - "giá tính thuế = giá bán chưa có thuế GTGT trừ tiền sử dụng đất hoặc tiền thuê đất nộp ngân sách"
    provisions:
      - 48/2024/QH15 Điều 7 khoản 1
    added_in: 2
  - id: q105
    question: Hàng tặng kèm theo chương trình khuyến mại đã đăng ký thì có phải tính thuế GTGT không?
    tax_type: vat
    form: plain
    answer: Hàng hóa, dịch vụ dùng để khuyến mại theo quy định của pháp luật về thương mại có giá tính thuế GTGT bằng không (0), nên không phát sinh thuế phải nộp.
    key_facts:
      - "hàng khuyến mại theo pháp luật thương mại có giá tính thuế bằng 0"
    provisions:
      - 48/2024/QH15 Điều 7 khoản 1
    added_in: 2
  - id: q106
    question: Công ty biếu quà Tết cho khách hàng bằng sản phẩm của mình thì giá tính thuế GTGT lấy theo giá nào?
    tax_type: vat
    form: plain
    answer: Hàng hóa dùng để biếu, tặng có giá tính thuế GTGT là giá tính thuế của hàng hóa cùng loại hoặc tương đương tại thời điểm biếu, tặng.
    key_facts:
      - "giá tính thuế của hàng hóa cùng loại hoặc tương đương tại thời điểm biếu, tặng"
    provisions:
      - 48/2024/QH15 Điều 7 khoản 1
    added_in: 2
  - id: q107
    question: Làm thầu xây dựng thì thời điểm phải tính thuế GTGT là lúc nghiệm thu hay lúc nhận tiền?
    tax_type: vat
    form: plain
    answer: >
      Lúc nghiệm thu: với hoạt động xây dựng, lắp đặt, thời điểm xác định thuế GTGT là thời điểm nghiệm thu, bàn giao công trình, hạng mục công trình hoặc khối lượng hoàn thành, không phân biệt đã thu được tiền hay chưa.
    key_facts:
      - "thời điểm nghiệm thu, bàn giao công trình, hạng mục, khối lượng hoàn thành"
      - "không phân biệt đã thu được tiền hay chưa"
    provisions:
      - 181/2025/NĐ-CP Điều 16 khoản 6
    added_in: 2
  - id: q108
    question: Doanh nghiệp mới thành lập muốn tự nguyện áp dụng phương pháp khấu trừ thuế GTGT thì cần điều kiện gì?
    tax_type: vat
    form: plain
    answer: >
      Doanh nghiệp phải thực hiện đầy đủ chế độ kế toán, hóa đơn, chứng từ. Doanh nghiệp mới thành lập được đăng ký tự nguyện
      áp dụng phương pháp khấu trừ khi: được thành lập từ dự án đầu tư của cơ sở đang nộp thuế theo phương pháp khấu trừ; hoặc
      có dự án đầu tư được cấp có thẩm quyền phê duyệt; hoặc có phương án đầu tư được người có thẩm quyền của doanh nghiệp
      quyết định phê duyệt.
    key_facts:
      - "thực hiện đầy đủ chế độ kế toán, hóa đơn, chứng từ"
      - "thành lập từ dự án đầu tư của cơ sở đang nộp thuế theo phương pháp khấu trừ"
      - "có dự án đầu tư được cấp có thẩm quyền phê duyệt hoặc phương án đầu tư được doanh nghiệp phê duyệt"
    provisions:
      - 181/2025/NĐ-CP Điều 21
    added_in: 2
  - id: q109
    question: Doanh thu một năm từ bao nhiêu trở lên thì doanh nghiệp bắt buộc phải nộp thuế GTGT theo phương pháp khấu trừ?
    tax_type: vat
    form: plain
    answer: >
      Cơ sở kinh doanh có doanh thu hằng năm từ bán hàng hóa, cung cấp dịch vụ từ 01 tỷ đồng trở lên và thực hiện đầy đủ chế độ
      kế toán, hóa đơn, chứng từ áp dụng phương pháp khấu trừ (trừ hộ, cá nhân kinh doanh). Doanh thu năm xác định từ kỳ tháng
      11 (quý 4) năm trước đến hết tháng 10 (quý 3) năm hiện tại, và phương pháp được áp dụng ổn định 02 năm liên tục.
    key_facts:
      - "doanh thu hằng năm từ 01 tỷ đồng trở lên"
      - "thực hiện đầy đủ chế độ kế toán, hóa đơn, chứng từ"
      - "áp dụng ổn định 02 năm liên tục"
    provisions:
      - 48/2024/QH15 Điều 11 khoản 2
      - 181/2025/NĐ-CP Điều 21
    added_in: 2
  - id: q110
    question: Tiệm kinh doanh mua bán vàng trang sức thì thuế GTGT tính theo cách nào?
    tax_type: vat
    form: plain
    answer: >
      Hoạt động mua, bán, chế tác vàng, bạc, đá quý nộp thuế GTGT theo phương pháp tính trực tiếp trên giá trị gia tăng: số thuế
      bằng giá trị gia tăng nhân thuế suất, trong đó giá trị gia tăng là giá thanh toán của vàng bán ra trừ giá thanh toán của
      vàng mua vào tương ứng. Cơ sở phải hạch toán riêng hoạt động này.
    key_facts:
      - "phương pháp tính trực tiếp trên giá trị gia tăng"
      - "giá trị gia tăng = giá thanh toán bán ra trừ giá thanh toán mua vào tương ứng"
      - "phải hạch toán riêng hoạt động mua bán vàng, bạc, đá quý"
    provisions:
      - 48/2024/QH15 Điều 12
      - 149/2025/QH15 Điều 1
      - 181/2025/NĐ-CP Điều 22
    added_in: 2
  - id: q111
    question: Hóa đơn đầu vào bị bỏ sót, sáu tháng sau mới phát hiện thì còn được kê khai khấu trừ không?
    tax_type: vat
    form: plain
    answer: >
      Còn. Hóa đơn đầu vào bị sót làm giảm số thuế phải nộp nên được kê khai vào tháng, quý phát hiện sai sót, với điều kiện khai
      trước khi cơ quan thuế, cơ quan có thẩm quyền công bố quyết định kiểm tra, thanh tra.
    key_facts:
      - "khai vào tháng, quý phát hiện sai sót"
      - "phải khai trước khi công bố quyết định kiểm tra, thanh tra"
    provisions:
      - 48/2024/QH15 Điều 14 khoản 1
    added_in: 2
  - id: q112
    question: Máy móc dùng chung cho hàng chịu thuế và hàng không chịu thuế GTGT thì thuế đầu vào được khấu trừ thế nào?
    tax_type: vat
    form: plain
    answer: >
      Chỉ được khấu trừ phần thuế đầu vào dùng cho hàng hóa, dịch vụ chịu thuế GTGT. Doanh nghiệp phải hạch toán riêng phần được
      khấu trừ và không được khấu trừ; nếu không hạch toán riêng được thì thuế đầu vào được khấu trừ tính theo tỷ lệ doanh thu
      hàng chịu thuế trên tổng doanh thu hàng hóa, dịch vụ bán ra.
    key_facts:
      - "chỉ khấu trừ thuế đầu vào dùng cho hàng hóa, dịch vụ chịu thuế"
      - "không hạch toán riêng được: phân bổ theo tỷ lệ doanh thu chịu thuế trên tổng doanh thu"
    provisions:
      - 48/2024/QH15 Điều 14 khoản 1
    added_in: 2
  - id: q113
    question: Công ty mua ô tô 5 chỗ giá 2 tỷ thì thuế GTGT đầu vào được khấu trừ hết hay chỉ một phần?
    tax_type: vat
    form: plain
    answer: >
      Chỉ một phần. Ô tô chở người từ 09 chỗ trở xuống là tài sản cố định có trị giá trên 1,6 tỷ đồng (chưa có thuế GTGT) chỉ được
      khấu trừ thuế đầu vào tương ứng với phần trị giá đến 1,6 tỷ đồng; trừ xe dùng kinh doanh vận chuyển hàng hóa, hành khách,
      du lịch, khách sạn hoặc làm mẫu, lái thử cho kinh doanh ô tô.
    key_facts:
      - "chỉ khấu trừ thuế đầu vào tương ứng phần trị giá đến 1,6 tỷ đồng"
      - "áp dụng cho ô tô chở người từ 09 chỗ trở xuống"
      - "trừ xe dùng kinh doanh vận tải, du lịch, khách sạn"
    provisions:
      - 181/2025/NĐ-CP Điều 24
    added_in: 2
  - id: q114
    question: Công ty đang xây nhà máy, chưa có doanh thu thì có được hoàn thuế GTGT đầu vào không?
    tax_type: vat
    form: plain
    answer: >
      Có thể. Cơ sở kinh doanh đã đăng ký nộp thuế theo phương pháp khấu trừ có dự án đầu tư đang trong giai đoạn đầu tư thì bù trừ
      thuế đầu vào của dự án với số thuế phải nộp của hoạt động đang có; sau bù trừ nếu số thuế đầu vào chưa được khấu trừ hết từ
      300 triệu đồng trở lên thì được hoàn. Một số dự án không được hoàn mà chỉ được kết chuyển, như chưa góp đủ vốn điều lệ hoặc
      chưa đủ điều kiện kinh doanh ngành nghề có điều kiện.
    key_facts:
      - "phải nộp thuế theo phương pháp khấu trừ, dự án đang trong giai đoạn đầu tư"
      - "thuế đầu vào chưa khấu trừ hết từ 300 triệu đồng trở lên sau bù trừ"
      - "không được hoàn nếu chưa góp đủ vốn điều lệ đã đăng ký"
    provisions:
      - 48/2024/QH15 Điều 15 khoản 2
    added_in: 2
  - id: q115
    question: Bán hàng cho doanh nghiệp trong khu chế xuất thì có được áp thuế suất GTGT 0% không?
    tax_type: vat
    form: plain
    answer: >
      Có, nếu hàng hóa bán cho tổ chức trong khu phi thuế quan và được tiêu dùng trong khu đó phục vụ trực tiếp cho sản xuất xuất
      khẩu. Phải có hợp đồng, chứng từ thanh toán không dùng tiền mặt và tờ khai hải quan. Không áp dụng 0% với xăng dầu mua nội
      địa và ô tô bán vào khu phi thuế quan.
    key_facts:
      - "bán cho tổ chức trong khu phi thuế quan, tiêu dùng trong khu phục vụ sản xuất xuất khẩu"
      - "có hợp đồng, chứng từ thanh toán không dùng tiền mặt, tờ khai hải quan"
      - "không áp dụng cho xăng dầu, ô tô bán vào khu phi thuế quan"
    provisions:
      - 181/2025/NĐ-CP Điều 17 khoản 1
      - 181/2025/NĐ-CP Điều 17 khoản 4
      - 181/2025/NĐ-CP Điều 18
    added_in: 2
  - id: q116
    question: Khách sạn phục vụ khách du lịch nước ngoài thì tiền phòng có được áp thuế suất 0% không?
    tax_type: vat
    form: plain
    answer: Không. Dịch vụ khách sạn, du lịch lữ hành cung cấp tại Việt Nam cho tổ chức, cá nhân nước ngoài thuộc các trường hợp không áp dụng thuế suất 0%.
    key_facts:
      - "dịch vụ khách sạn cung cấp tại Việt Nam cho người nước ngoài không áp dụng thuế suất 0%"
    provisions:
      - 181/2025/NĐ-CP Điều 17 khoản 4
    added_in: 2
  - id: q117
    question: Nông dân tự trồng rau rồi mang ra chợ bán thì có phải chịu thuế GTGT không?
    tax_type: vat
    form: plain
    answer: Không. Sản phẩm trồng trọt chưa chế biến hoặc chỉ qua sơ chế thông thường do cá nhân tự sản xuất bán ra thuộc đối tượng không chịu thuế GTGT.
    key_facts:
      - "sản phẩm cây trồng tự sản xuất bán ra, chưa chế biến: không chịu thuế GTGT"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 1
      - 149/2025/QH15 Điều 1
    added_in: 2
  - id: q118
    question: Phòng khám tư nhân thu tiền khám chữa bệnh thì có phải tính thuế GTGT không?
    tax_type: vat
    form: plain
    answer: Không. Dịch vụ khám bệnh, chữa bệnh, phòng bệnh cho người thuộc đối tượng không chịu thuế GTGT, kể cả tiền thuốc nằm trong gói dịch vụ chữa bệnh.
    key_facts:
      - "dịch vụ khám bệnh, chữa bệnh không chịu thuế GTGT"
      - "tiền thuốc trong gói dịch vụ chữa bệnh cũng không chịu thuế"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 10
    added_in: 2
  - id: q119
    question: Phí bảo hiểm nhân thọ khách hàng đóng có chịu thuế GTGT không?
    tax_type: vat
    form: plain
    answer: Không. Bảo hiểm nhân thọ thuộc đối tượng không chịu thuế GTGT.
    key_facts:
      - "bảo hiểm nhân thọ không chịu thuế GTGT"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 8
    added_in: 2
  - id: q120
    question: Theo Điều 5 Luật 48/2024, chuyển giao công nghệ có thuộc diện không chịu thuế GTGT không?
    tax_type: vat
    form: reference
    answer: Có. Chuyển giao công nghệ theo Luật Chuyển giao công nghệ thuộc đối tượng không chịu thuế GTGT (khoản 21 Điều 5), cùng với chuyển nhượng quyền sở hữu trí tuệ và sản phẩm, dịch vụ phần mềm.
    key_facts:
      - "chuyển giao công nghệ theo Luật Chuyển giao công nghệ không chịu thuế GTGT"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 21
    added_in: 2
  - id: q121  # step 2: moved to unanswerable; 181/2025 Điều 26 khoản 1 defines a non-cash payment voucher by reference to Decree 52/2024/NĐ-CP, which is not in the corpus, and never names e-wallets
    question: Theo Nghị định 181/2025, thanh toán qua ví điện tử có được coi là thanh toán không dùng tiền mặt để khấu trừ thuế đầu vào không?
    tax_type: vat
    form: reference
    answer: >
      Nghị định 181/2025 định nghĩa chứng từ thanh toán không dùng tiền mặt bằng cách dẫn chiếu Nghị định 52/2024/NĐ-CP về thanh
      toán không dùng tiền mặt và không nêu ví điện tử; Nghị định 52/2024 không có trong bộ dữ liệu, nên không xác định được.
    unanswerable: out_of_scope
    added_in: 2
  - id: q122  # step 2: Thông tư 69/2025 named in the question only sets dossiers (Điều 3); the list of non-taxable imported machinery is in 48/2024/QH15 Điều 5 khoản 17 and 181/2025/NĐ-CP Điều 4 khoản 10
    question: Theo Thông tư 69/2025, máy móc nhập khẩu để tạo tài sản cố định mà trong nước chưa sản xuất được thì có phải chịu thuế GTGT không?
    tax_type: vat
    form: reference
    answer: >
      Thông tư 69/2025 chỉ quy định hồ sơ. Theo Luật 48/2024, máy móc nhập khẩu loại trong nước chưa sản xuất được chỉ không chịu
      thuế GTGT khi dùng trực tiếp cho nghiên cứu khoa học, phát triển công nghệ hoặc cho tìm kiếm thăm dò, phát triển mỏ dầu khí;
      riêng để tạo tài sản cố định thì chỉ có máy bay, trực thăng, tàu lượn, giàn khoan, tàu thuyền chưa sản xuất được trong nước.
      Máy móc thông thường nhập khẩu để tạo tài sản cố định không thuộc các trường hợp này nên vẫn chịu thuế GTGT.
    key_facts:
      - "tạo tài sản cố định: chỉ máy bay, trực thăng, tàu lượn, giàn khoan, tàu thuyền trong nước chưa sản xuất được"
      - "máy móc chưa sản xuất được dùng trực tiếp cho nghiên cứu khoa học hoặc dầu khí không chịu thuế"
      - "máy móc thông thường nhập khẩu tạo tài sản cố định vẫn chịu thuế GTGT"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 17
      - 181/2025/NĐ-CP Điều 4 khoản 10
    added_in: 2
  - id: q123
    question: Thông tư 77/2025 quy định dịch vụ môi giới chứng khoán có chịu thuế GTGT không?
    tax_type: vat
    form: reference
    answer: Không. Môi giới chứng khoán là dịch vụ kinh doanh chứng khoán thuộc đối tượng không chịu thuế GTGT.
    key_facts:
      - "môi giới chứng khoán không chịu thuế GTGT"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 9
      - 77/2025/TT-BTC Điều 3
    added_in: 2
  - id: q124
    question: Nghị định 144/2026 có thay đổi điều kiện hoàn thuế GTGT cho hàng xuất khẩu không?
    tax_type: vat
    form: reference
    answer: >
      Không. Nghị định 144/2026 (hiệu lực từ 20/6/2026) không sửa các quy định về hoàn thuế hàng xuất khẩu; nó sửa Điều 4 (đối
      tượng không chịu thuế: bảo hiểm, bán nợ, tài nguyên khoáng sản xuất khẩu), điểm b khoản 1 Điều 9, khoản 2 Điều 23 (doanh
      thu dùng để phân bổ thuế đầu vào được khấu trừ), điểm g khoản 2 Điều 26 (mua trả chậm, trả góp) và thay Phụ lục I, II của
      Nghị định 181/2025.
    key_facts:
      - "không sửa quy định về hoàn thuế hàng xuất khẩu"
      - "sửa khoản 2 Điều 23 về doanh thu để phân bổ thuế đầu vào"
      - "sửa điểm g khoản 2 Điều 26 về mua trả chậm, trả góp"
      - "hiệu lực từ ngày 20/6/2026"
    provisions:
      - 144/2026/NĐ-CP Điều 1
      - 144/2026/NĐ-CP Điều 2
      - 144/2026/NĐ-CP Điều 3
      - 144/2026/NĐ-CP Điều 4
      - 144/2026/NĐ-CP Điều 5
      - 144/2026/NĐ-CP Điều 6
    added_in: 2
  - id: q125
    question: Điều 14 Luật 48/2024 quy định thuế GTGT đầu vào muốn được khấu trừ thì phải có những điều kiện gì?
    tax_type: vat
    form: reference
    answer: >
      Thuế GTGT đầu vào được khấu trừ khi có hóa đơn GTGT mua hàng hóa, dịch vụ (hoặc chứng từ nộp thuế GTGT khâu nhập khẩu, chứng
      từ nộp thay cho phía nước ngoài) và có chứng từ thanh toán không dùng tiền mặt, trừ trường hợp đặc thù do Chính phủ quy định.
      Với hàng hóa, dịch vụ xuất khẩu còn phải có hợp đồng với bên nước ngoài, hóa đơn bán hàng, chứng từ thanh toán không dùng tiền
      mặt, tờ khai hải quan, phiếu đóng gói, vận đơn, chứng từ bảo hiểm (nếu có).
    key_facts:
      - "có hóa đơn GTGT hoặc chứng từ nộp thuế GTGT khâu nhập khẩu"
      - "có chứng từ thanh toán không dùng tiền mặt"
      - "hàng xuất khẩu: thêm hợp đồng với bên nước ngoài và tờ khai hải quan"
    provisions:
      - 48/2024/QH15 Điều 14 khoản 2
    added_in: 2
  - id: q126
    question: Luật 09/2026/QH16 sửa những điểm nào trong Luật Thuế giá trị gia tăng?
    tax_type: vat
    form: reference
    answer: >
      Luật 09/2026/QH16 chỉ sửa khoản 25 Điều 5 Luật Thuế GTGT: hàng hóa, dịch vụ của hộ, cá nhân kinh doanh có doanh thu năm từ mức
      do Chính phủ quy định trở xuống không chịu thuế GTGT, và Chính phủ quy định mức doanh thu đó theo từng thời kỳ. Quy định này có
      hiệu lực từ ngày 01/01/2026.
    key_facts:
      - "sửa khoản 25 Điều 5 Luật Thuế GTGT"
      - "ngưỡng doanh thu không chịu thuế của hộ, cá nhân kinh doanh do Chính phủ quy định"
      - "hiệu lực từ 01/01/2026"
    provisions:
      - 09/2026/QH16 Điều 2
      - 09/2026/QH16 Điều 5
    added_in: 2
  - id: q127
    question: Đi du lịch Thái Lan mua hàng thì được hoàn thuế VAT ở sân bay bao nhiêu phần trăm?
    tax_type: vat
    form: plain
    answer: Các văn bản trong bộ dữ liệu chỉ gồm pháp luật thuế Việt Nam, không có quy định hoàn thuế VAT cho du khách tại Thái Lan.
    unanswerable: out_of_scope
    added_in: 2
  - id: q128
    question: Phần mềm kế toán MISA tự lên tờ khai thuế GTGT bằng cách nào?
    tax_type: vat
    form: plain
    answer: Các văn bản trong bộ dữ liệu không mô tả cách phần mềm kế toán MISA lập tờ khai thuế GTGT.
    unanswerable: out_of_scope
    added_in: 2
  - id: q129
    question: Vì sao Quốc hội lại nâng ngưỡng doanh thu không phải nộp thuế GTGT lên 500 triệu?
    tax_type: vat
    form: plain
    answer: Các văn bản trong bộ dữ liệu chỉ ghi quy định, không nêu lý do Quốc hội nâng ngưỡng doanh thu không chịu thuế GTGT.
    unanswerable: out_of_scope
    added_in: 2
  - id: q130
    question: Quầy hoàn thuế GTGT cho khách nước ngoài ở sân bay Tân Sơn Nhất mở cửa từ mấy giờ?
    tax_type: vat
    form: plain
    answer: Các văn bản trong bộ dữ liệu không có thông tin về giờ mở cửa của quầy hoàn thuế GTGT tại sân bay Tân Sơn Nhất.
    unanswerable: out_of_scope
    added_in: 2
  - id: q131
    question: Năm ngoái doanh nghiệp nào được hoàn thuế GTGT nhiều nhất cả nước?
    tax_type: vat
    form: plain
    answer: Các văn bản trong bộ dữ liệu là văn bản pháp luật, không có số liệu về doanh nghiệp được hoàn thuế GTGT nhiều nhất.
    unanswerable: out_of_scope
    added_in: 2
  - id: q132  # step 2: repealed confirmed: 69/2025/TT-BTC Điều 10 khoản 2 replaces 219/2013/TT-BTC
    question: Theo Thông tư 219/2013, doanh nghiệp có số thuế GTGT đầu vào chưa khấu trừ hết từ 300 triệu đồng trở lên sau 12 tháng liên tục thì được hoàn thuế, đúng không?
    tax_type: vat
    form: reference
    answer: >
      Thông tư 219/2013/TT-BTC đã được thay thế bởi Thông tư 69/2025/TT-BTC nên không còn áp dụng. Hiện nay Luật 48/2024 quy định
      hoàn thuế sau 12 tháng hoặc 04 quý liên tục với số thuế chưa khấu trừ hết từ 300 triệu đồng chỉ cho cơ sở kinh doanh chỉ sản
      xuất, cung cấp hàng hóa, dịch vụ chịu thuế suất 5%.
    unanswerable: repealed
    added_in: 2
  - id: q133  # step 2: repealed confirmed: 48/2024/QH15 Điều 18 repeals Law 13/2008/QH12
    question: Theo Luật Thuế GTGT số 13/2008/QH12, phân bón có thuộc đối tượng không chịu thuế không?
    tax_type: vat
    form: reference
    answer: >
      Luật Thuế GTGT số 13/2008/QH12 đã hết hiệu lực, được thay bằng Luật 48/2024/QH15. Theo luật hiện hành, phân bón không còn là
      đối tượng không chịu thuế mà chịu thuế suất 5%.
    unanswerable: repealed
    added_in: 2
  - id: q134
    question: Mức giảm trừ gia cảnh cho bản thân người đi làm hiện nay là bao nhiêu một tháng?
    tax_type: pit
    form: plain
    answer: Mức giảm trừ gia cảnh cho bản thân người nộp thuế là 15,5 triệu đồng/tháng (186 triệu đồng/năm).
    key_facts:
      - "15,5 triệu đồng/tháng"
      - "186 triệu đồng/năm"
    provisions:
      - 109/2025/QH15 Điều 10
    added_in: 2
  - id: q135
    question: Muốn đăng ký bố mẹ già là người phụ thuộc thì thu nhập của bố mẹ phải dưới mức bao nhiêu?
    tax_type: pit
    form: plain
    answer: >
      Bố mẹ hết tuổi lao động phải không có thu nhập hoặc có thu nhập bình quân tháng trong năm từ tất cả các nguồn không vượt quá
      03 triệu đồng. Nếu bố mẹ còn trong độ tuổi lao động thì còn phải không có khả năng lao động.
    key_facts:
      - "thu nhập bình quân tháng từ tất cả các nguồn không vượt quá 03 triệu đồng"
      - "trong độ tuổi lao động thì phải không có khả năng lao động"
    provisions:
      - 87/2026/TT-BTC Điều 3
      - 253/2026/NĐ-CP Điều 47 khoản 3
    added_in: 2
  - id: q136
    question: Con tôi 20 tuổi đang học đại học, không đi làm, thì có được đăng ký người phụ thuộc không?
    tax_type: pit
    form: plain
    answer: >
      Được. Con đang học đại học, cao đẳng, trung học chuyên nghiệp hoặc học nghề là người phụ thuộc nếu không có thu nhập hoặc có
      thu nhập bình quân tháng trong năm từ tất cả các nguồn không vượt quá 03 triệu đồng; mức giảm trừ là 6,2 triệu đồng/tháng.
    key_facts:
      - "con đang học đại học không có thu nhập được tính là người phụ thuộc"
      - "thu nhập bình quân tháng không vượt quá 03 triệu đồng"
      - "giảm trừ 6,2 triệu đồng/tháng cho mỗi người phụ thuộc"
    provisions:
      - 253/2026/NĐ-CP Điều 47 khoản 2
      - 87/2026/TT-BTC Điều 3
      - 109/2025/QH15 Điều 10
    added_in: 2
  - id: q137
    question: Tiền làm thêm giờ ban đêm có bị tính thuế thu nhập cá nhân không?
    tax_type: pit
    form: plain
    answer: >
      Không. Tiền lương làm việc ban đêm, làm thêm giờ tại nơi làm việc phù hợp với điều kiện và thời gian theo pháp luật lao động được
      miễn thuế TNCN. Tổ chức trả thu nhập phải lập bảng kê thời gian và tiền lương làm đêm, làm thêm giờ, hoặc chứng minh qua bảng
      lương, bảng chấm công, hợp đồng lao động.
    key_facts:
      - "tiền lương làm đêm, làm thêm giờ được miễn thuế TNCN"
      - "phải phù hợp điều kiện và thời gian theo pháp luật lao động"
      - "tổ chức trả thu nhập lập bảng kê hoặc chứng minh qua bảng lương, bảng chấm công"
    provisions:
      - 109/2025/QH15 Điều 4 khoản 8
      - 253/2026/NĐ-CP Điều 26 khoản 1
    added_in: 2
  - id: q138
    question: Tiền thưởng Tết công ty phát có phải chịu thuế thu nhập cá nhân không?
    tax_type: pit
    form: plain
    answer: Có. Các khoản thưởng bằng tiền hoặc không bằng tiền người sử dụng lao động chi cho người lao động là thu nhập từ tiền lương, tiền công chịu thuế TNCN.
    key_facts:
      - "tiền thưởng do người sử dụng lao động chi là thu nhập chịu thuế từ tiền lương, tiền công"
    provisions:
      - 253/2026/NĐ-CP Điều 8 khoản 2
    added_in: 2
  - id: q139
    question: Trúng xổ số Vietlott 2 tỷ thì bị trừ bao nhiêu tiền thuế?
    tax_type: pit
    form: plain
    answer: >
      Với cá nhân cư trú, thuế TNCN từ trúng thưởng bằng 10% trên phần giá trị giải thưởng vượt 20 triệu đồng mỗi lần trúng. Trúng 2
      tỷ đồng thì thuế là (2.000 − 20) triệu × 10% = 198 triệu đồng.
    key_facts:
      - "thuế suất 10%"
      - "tính trên phần giá trị giải thưởng vượt trên 20 triệu đồng mỗi lần"
      - "giải 2 tỷ đồng: thuế 198 triệu đồng"
    provisions:
      - 109/2025/QH15 Điều 15
    added_in: 2
  - id: q140
    question: Tôi được thừa kế căn nhà của bố mẹ để lại thì có phải nộp thuế thu nhập cá nhân không?
    tax_type: pit
    form: plain
    answer: Không. Thu nhập từ nhận thừa kế bất động sản giữa cha đẻ, mẹ đẻ với con đẻ được miễn thuế TNCN.
    key_facts:
      - "nhận thừa kế bất động sản giữa cha mẹ đẻ và con đẻ được miễn thuế TNCN"
    provisions:
      - 109/2025/QH15 Điều 4 khoản 1
    added_in: 2
  - id: q141
    question: Anh trai cho em gái một mảnh đất thì em gái có được miễn thuế thu nhập cá nhân không?
    tax_type: pit
    form: plain
    answer: Có. Thu nhập từ nhận quà tặng là bất động sản giữa anh, chị, em ruột với nhau được miễn thuế TNCN.
    key_facts:
      - "quà tặng bất động sản giữa anh, chị, em ruột được miễn thuế TNCN"
    provisions:
      - 109/2025/QH15 Điều 4 khoản 1
    added_in: 2
  - id: q142
    question: Bán căn nhà duy nhất đang ở thì có được miễn thuế thu nhập cá nhân không?
    tax_type: pit
    form: plain
    answer: >
      Có, nếu tại thời điểm chuyển nhượng người bán chỉ có duy nhất một nhà ở hoặc quyền sử dụng một thửa đất ở tại Việt Nam và đã có
      quyền sở hữu, sử dụng tối thiểu 183 ngày. Không áp dụng với nhà ở, công trình hình thành trong tương lai; nhà đồng sở hữu thì chỉ
      người không có nhà, đất ở nơi khác được miễn.
    key_facts:
      - "chỉ có duy nhất một nhà ở, đất ở tại Việt Nam tại thời điểm chuyển nhượng"
      - "có quyền sở hữu, sử dụng tối thiểu 183 ngày"
      - "không áp dụng cho nhà ở hình thành trong tương lai"
    provisions:
      - 109/2025/QH15 Điều 4 khoản 2
      - 253/2026/NĐ-CP Điều 19
    added_in: 2
  - id: q143
    question: Tiền lãi gửi tiết kiệm ngân hàng có bị đánh thuế thu nhập cá nhân không?
    tax_type: pit
    form: plain
    answer: Không. Lãi tiền gửi tại tổ chức tín dụng được miễn thuế thu nhập cá nhân.
    key_facts:
      - "lãi tiền gửi tại tổ chức tín dụng được miễn thuế TNCN"
    provisions:
      - 109/2025/QH15 Điều 4 khoản 6
      - 253/2026/NĐ-CP Điều 24
    added_in: 2
  - id: q144
    question: Nhận cổ tức bằng tiền mặt thì bị khấu trừ thuế thu nhập cá nhân bao nhiêu phần trăm?
    tax_type: pit
    form: plain
    answer: Thu nhập từ đầu tư vốn, gồm cổ tức, của cá nhân cư trú chịu thuế suất 5% trên từng lần nhận.
    key_facts:
      - "thuế suất 5%"
      - "tính theo từng lần phát sinh"
    provisions:
      - 109/2025/QH15 Điều 12
    added_in: 2
  - id: q145
    question: Bán cổ phiếu trên sàn chứng khoán thì nộp thuế thu nhập cá nhân bao nhiêu?
    tax_type: pit
    form: plain
    answer: Thuế TNCN từ chuyển nhượng chứng khoán bằng giá chuyển nhượng nhân 0,1% theo từng lần chuyển nhượng.
    key_facts:
      - "0,1% trên giá chuyển nhượng từng lần"
    provisions:
      - 109/2025/QH15 Điều 13 khoản 2
    added_in: 2
  - id: q146
    question: Công ty mua bảo hiểm nhân thọ cho nhân viên thì phí bảo hiểm đó có tính vào thu nhập chịu thuế của nhân viên không?
    tax_type: pit
    form: plain
    answer: >
      Tiền công ty mua bảo hiểm nhân thọ cho nhân viên là thu nhập chịu thuế, nhưng nếu doanh nghiệp bảo hiểm thành lập tại Việt Nam
      thì chưa tính vào thu nhập khi mua; đến khi đáo hạn, doanh nghiệp bảo hiểm khấu trừ 10% trên tiền phí tích lũy (với phí từ
      01/01/2026, chỉ trên phần vượt 03 triệu đồng/tháng). Nếu mua của doanh nghiệp bảo hiểm nước ngoài được phép bán tại Việt Nam,
      công ty khấu trừ 10% trên phần phí vượt 03 triệu đồng/tháng trước khi trả lương.
    key_facts:
      - "bảo hiểm của doanh nghiệp thành lập tại Việt Nam: chưa tính thuế khi mua"
      - "khi đáo hạn: khấu trừ 10% trên tiền phí tích lũy"
      - "phí từ 01/01/2026: chỉ tính trên phần vượt 03 triệu đồng/tháng"
      - "doanh nghiệp bảo hiểm nước ngoài: công ty khấu trừ 10% phần phí vượt mức trước khi trả lương"
    provisions:
      - 253/2026/NĐ-CP Điều 8 khoản 2
      - 253/2026/NĐ-CP Điều 50 khoản 3
      - 253/2026/NĐ-CP Điều 46 khoản 2
    added_in: 2
  - id: q147
    question: Công ty phát tiền đồng phục bằng tiền mặt thì khoản đó có bị tính thuế thu nhập cá nhân không?
    tax_type: pit
    form: plain
    answer: >
      Phần khoán chi trang phục cao hơn mức được trừ khi tính thuế TNDN thì tính vào thu nhập chịu thuế TNCN. Với doanh nghiệp, chi
      trang phục bằng tiền được trừ tối đa 05 triệu đồng/người/năm, nên phần tiền đồng phục vượt 05 triệu đồng/người/năm bị tính thuế.
    key_facts:
      - "phần khoán chi trang phục vượt mức chi phí được trừ thuế TNDN là thu nhập chịu thuế"
      - "chi trang phục bằng tiền tối đa 05 triệu đồng/người/năm"
    provisions:
      - 253/2026/NĐ-CP Điều 8 khoản 2
      - 320/2025/NĐ-CP Điều 10 khoản 8
    added_in: 2
  - id: q148
    question: Tiền nhuận bút viết sách có phải nộp thuế thu nhập cá nhân không?
    tax_type: pit
    form: plain
    answer: Có. Tiền nhuận bút theo chế độ nhuận bút là thu nhập từ tiền lương, tiền công chịu thuế TNCN.
    key_facts:
      - "tiền nhuận bút là thu nhập từ tiền lương, tiền công chịu thuế"
    provisions:
      - 253/2026/NĐ-CP Điều 8 khoản 2
    added_in: 2
  - id: q149
    question: Tự đóng quỹ hưu trí tự nguyện thì được trừ tối đa bao nhiêu khi tính thuế thu nhập?
    tax_type: pit
    form: plain
    answer: >
      Khoản đóng bảo hiểm hưu trí bổ sung, hưu trí tự nguyện, bảo hiểm nhân thọ được trừ tổng cộng tối đa 03 triệu đồng/tháng cho tất
      cả các hình thức, gồm cả phần người sử dụng lao động đóng và phần tự đóng; căn cứ là chứng từ nộp tiền do tổ chức bảo hiểm, quỹ
      hưu trí cấp.
    key_facts:
      - "tối đa 03 triệu đồng/tháng"
      - "tính chung cho hưu trí bổ sung, hưu trí tự nguyện và bảo hiểm nhân thọ"
      - "gồm cả phần người sử dụng lao động đóng và phần tự đóng"
    provisions:
      - 253/2026/NĐ-CP Điều 46 khoản 2
    added_in: 2
  - id: q150
    question: Tôi ủng hộ tiền thông qua một quỹ từ thiện được thành lập và hoạt động hợp pháp thì khoản đóng góp đó có được trừ khi tính thuế TNCN không?
    tax_type: pit
    form: plain
    answer: >
      Được. Cá nhân cư trú được trừ khoản đóng góp vào quỹ từ thiện, quỹ nhân đạo, quỹ khuyến học vào thu nhập chịu thuế từ tiền lương,
      tiền công trước khi tính thuế, nếu quỹ được cơ quan nhà nước có thẩm quyền cho phép thành lập hoặc công nhận, hoạt động không vì
      lợi nhuận, và khoản đóng góp có chứng từ hợp lệ.
    key_facts:
      - "đóng góp vào quỹ từ thiện được trừ vào thu nhập từ tiền lương, tiền công"
      - "quỹ phải được cơ quan nhà nước có thẩm quyền cho phép thành lập hoặc công nhận"
      - "phải có hóa đơn, chứng từ hợp lệ"
    provisions:
      - 109/2025/QH15 Điều 11
    added_in: 2
  - id: q151
    question: Người mắc bệnh hiểm nghèo không đủ tiền nộp thuế thì có được giảm thuế thu nhập cá nhân không?
    tax_type: pit
    form: plain
    answer: >
      Có. Người nộp thuế gặp khó khăn do bệnh hiểm nghèo ảnh hưởng đến khả năng nộp thuế được xét giảm thuế tương ứng với mức độ thiệt
      hại nhưng không vượt quá số thuế phải nộp; việc giảm được xét theo năm, cho số thuế của năm mắc bệnh. Bệnh hiểm nghèo xác định
      theo quy định của Bộ trưởng Bộ Y tế.
    key_facts:
      - "được giảm thuế tương ứng mức độ thiệt hại"
      - "không vượt quá số thuế phải nộp"
      - "xét giảm theo năm phát sinh"
    provisions:
      - 109/2025/QH15 Điều 5 khoản 1
      - 253/2026/NĐ-CP Điều 40
    added_in: 2
  - id: q152
    question: Theo Luật 109/2025, bán phần vốn góp trong công ty TNHH thì chịu thuế thu nhập cá nhân bao nhiêu?
    tax_type: pit
    form: reference
    answer: >
      Chuyển nhượng phần vốn góp chịu thuế 20% trên thu nhập tính thuế (giá chuyển nhượng trừ giá mua và chi phí hợp lý) theo từng lần
      chuyển nhượng; nếu không xác định được giá mua và chi phí thì nộp 2% trên giá chuyển nhượng.
    key_facts:
      - "20% trên giá chuyển nhượng trừ giá mua và chi phí hợp lý"
      - "không xác định được giá mua: 2% trên giá chuyển nhượng"
    provisions:
      - 109/2025/QH15 Điều 13 khoản 1
    added_in: 2
  - id: q153
    question: Theo Nghị định 253/2026, phụ cấp thu hút trả cho người làm việc tại vùng có điều kiện kinh tế - xã hội đặc biệt khó khăn có được miễn thuế TNCN không?
    tax_type: pit
    form: reference
    answer: Có. Phụ cấp thu hút, phụ cấp khu vực không tính vào thu nhập chịu thuế TNCN, nếu do cơ quan nhà nước có thẩm quyền quy định; phần nhận cao hơn mức quy định phải tính thuế.
    key_facts:
      - "phụ cấp thu hút không tính vào thu nhập chịu thuế"
      - "phần vượt mức quy định của cơ quan nhà nước có thẩm quyền phải tính thuế"
    provisions:
      - 253/2026/NĐ-CP Điều 8 khoản 3
    added_in: 2
  - id: q154  # step 2: moved to unanswerable; neither 87/2026/TT-BTC nor 89/2026/TT-BTC names the form in its text (89 Điều 22 khoản 1 refers to Phụ lục I, an annex the corpus does not chunk)
    question: Thông tư 87/2026 quy định cá nhân tự quyết toán thuế thu nhập cá nhân dùng tờ khai mẫu nào?
    tax_type: pit
    form: reference
    answer: >
      Thông tư 87/2026 không quy định mẫu tờ khai quyết toán; Thông tư 89/2026 dẫn chiếu hồ sơ quyết toán thuế TNCN tới điểm 7.1 Phụ lục I,
      nhưng phụ lục không có trong bộ dữ liệu nên không xác định được mẫu số.
    unanswerable: out_of_scope
    added_in: 2
  - id: q155
    question: Điều 4 Luật 109/2025 quy định những khoản thu nhập nào được miễn thuế?
    tax_type: pit
    form: reference
    answer: >
      Điều 4 Luật 109/2025 miễn thuế cho các khoản: chuyển nhượng, thừa kế, quà tặng bất động sản giữa người thân trực hệ và anh chị em
      ruột; bán nhà ở, đất ở duy nhất; giá trị quyền sử dụng đất được Nhà nước giao; thu nhập trực tiếp sản xuất nông, lâm, ngư nghiệp
      chưa chế biến, sản xuất muối; chuyển đổi đất nông nghiệp được giao; lãi trái phiếu chính phủ, lãi tiền gửi, lãi bảo hiểm nhân thọ;
      kiều hối; tiền lương làm đêm, làm thêm giờ, ngày không nghỉ phép; lương hưu; học bổng; tiền bồi thường bảo hiểm, tai nạn lao động;
      thu nhập từ quỹ từ thiện, viện trợ nước ngoài; lương thuyền viên làm cho hãng tàu nước ngoài; thu nhập từ khoa học, công nghệ, đổi
      mới sáng tạo, khởi nghiệp sáng tạo; lương chuyên gia dự án ODA; thu nhập sau thuế TNDN của chủ doanh nghiệp tư nhân, công ty TNHH
      một thành viên, và một số khoản khác.
    key_facts:
      - "bất động sản chuyển nhượng, thừa kế, tặng giữa vợ chồng, cha mẹ con, anh chị em ruột"
      - "nhà ở, đất ở duy nhất"
      - "lãi tiền gửi tại tổ chức tín dụng, kiều hối"
      - "tiền lương làm đêm, làm thêm giờ; lương hưu"
    provisions:
      - 109/2025/QH15 Điều 4
    added_in: 2
  - id: q156
    question: Luật 09/2026/QH16 sửa gì về thuế thu nhập cá nhân khi bán nhà đất?
