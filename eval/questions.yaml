        answer: >
          Hồ sơ hoàn thuế GTGT nộp cho cơ quan thuế quản lý trực tiếp (riêng dự án đầu tư là nơi nhận hồ sơ khai
          thuế của dự án). Cơ quan thuế thông báo tiếp nhận trong 03 ngày làm việc. Hồ sơ hoàn trước được giải
          quyết chậm nhất 06 ngày làm việc kể từ ngày thông báo tiếp nhận; hồ sơ kiểm tra trước hoàn thuế chậm nhất
          10 ngày làm việc kể từ ngày có kết luận hoặc quyết định xử lý sau kiểm tra tại trụ sở.
