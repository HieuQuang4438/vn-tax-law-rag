  - id: c05
    turns:
      - question: Tôi là người nước ngoài, hết hợp đồng về nước giữa năm thì có phải quyết toán thuế thu nhập cá nhân trước khi đi không?
        tax_type: pit
        form: plain
        answer: >
          Nếu bạn là cá nhân cư trú thì phải quyết toán thuế với cơ quan thuế trước khi xuất cảnh, hoặc ủy quyền
          cho tổ chức, cá nhân khác quyết toán thay. Nếu là cá nhân không cư trú thì thuế 20% được khấu trừ theo
          từng lần trả thu nhập (kỳ tính thuế theo từng lần phát sinh), không có quyết toán năm.
        key_facts:
          - "cá nhân cư trú người nước ngoài kết thúc hợp đồng phải quyết toán trước khi xuất cảnh"
          - "được ủy quyền cho tổ chức, cá nhân khác quyết toán"
          - "cá nhân không cư trú: kỳ tính thuế theo từng lần phát sinh, thuế suất 20%"
        provisions:
          - 253/2026/NĐ-CP Điều 50 khoản 3
          - 253/2026/NĐ-CP Điều 66 khoản 2
          - 253/2026/NĐ-CP Điều 64 khoản 1
      - question: Hạn chót nộp hồ sơ đó là khi nào?
        tax_type: administration
        form: plain
        answer: >
          Hồ sơ quyết toán phải nộp trước khi xuất cảnh, nhưng không quá 45 ngày kể từ ngày kết thúc hợp đồng lao
          động.
        key_facts:
          - "trước khi xuất cảnh"
          - "không quá 45 ngày kể từ ngày kết thúc hợp đồng lao động"
        provisions:
          - 252/2026/NĐ-CP Điều 10 khoản 5
      - question: Nếu nộp trễ thì có bị phạt không?
        tax_type: administration
        form: plain
        answer: >
          Có thể. Nếu quyết toán chậm mà có số thuế được hoàn thì không bị xử phạt. Nếu nộp tiền thuế trễ thì phải
          nộp tiền chậm nộp 0,03%/ngày. Nộp hồ sơ sau 90 ngày kể từ hết hạn mà dẫn đến thiếu thuế là hành vi trốn
          thuế (phạt 01 đến 03 lần số thuế trốn), trừ khi đã nộp đủ thuế và tiền chậm nộp trước khi cơ quan thuế
          công bố quyết định kiểm tra hoặc lập biên bản, khi đó chỉ bị phạt về thủ tục. Mức phạt tiền cụ thể cho vi
          phạm thủ tục không có trong các văn bản của bộ dữ liệu.
        key_facts:
          - "quyết toán chậm mà có số thuế được hoàn: không bị xử phạt"
          - "tiền chậm nộp 0,03%/ngày trên số thuế nộp chậm"
          - "nộp hồ sơ sau 90 ngày dẫn đến thiếu thuế: trốn thuế, phạt 01 đến 03 lần số thuế trốn"
          - "đã nộp đủ thuế và tiền chậm nộp trước khi cơ quan thuế công bố quyết định kiểm tra: chỉ phạt thủ tục"
        provisions:
          - 108/2025/QH15 Điều 44 khoản 2
          - 108/2025/QH15 Điều 44 khoản 3
          - 108/2025/QH15 Điều 45 khoản 4
          - 108/2025/QH15 Điều 16 khoản 2
  - id: c06
    turns:
      - question: Nhập khẩu rượu vang về bán thì thuế tiêu thụ đặc biệt tính trên giá nào?
        tax_type: sct
        form: plain
        answer: >
          Ở khâu nhập khẩu, giá tính thuế TTĐB là trị giá tính thuế nhập khẩu cộng thuế nhập khẩu (và thuế nhập
          khẩu bổ sung nếu có), không gồm số thuế nhập khẩu được miễn, giảm. Khi bán ra trong nước, giá tính thuế
          là giá bán chưa có thuế GTGT (trừ thuế bảo vệ môi trường nếu có) chia cho (1 + thuế suất TTĐB).
        key_facts:
          - "khâu nhập khẩu: trị giá tính thuế nhập khẩu + thuế nhập khẩu (+ thuế nhập khẩu bổ sung)"
          - "không gồm thuế nhập khẩu được miễn, giảm"
          - "khâu bán ra: giá bán chưa có thuế GTGT chia (1 + thuế suất TTĐB)"
        provisions:
          - 66/2025/QH15 Điều 6 khoản 1
          - 360/2025/NĐ-CP Điều 5 khoản 1
      - question: Khi bán lại cho đại lý trong nước thì có phải nộp thuế tiêu thụ đặc biệt lần nữa không?
        tax_type: sct
        form: plain
        answer: >
          Doanh nghiệp nhập khẩu tính thuế TTĐB trên giá bán ra trong nước nhưng được khấu trừ số thuế TTĐB đã nộp ở
          khâu nhập khẩu tương ứng với số hàng bán ra, tối đa bằng số thuế tính ở khâu bán ra, nên không chịu thuế
          hai lần. Đại lý không phải người nộp thuế TTĐB khi bán lại. Nếu bán qua đại lý bán đúng giá hưởng hoa
          hồng, giá làm căn cứ tính thuế là giá do doanh nghiệp nhập khẩu quy định, chưa trừ hoa hồng.
        key_facts:
          - "được khấu trừ số thuế TTĐB đã nộp ở khâu nhập khẩu khi tính thuế ở khâu bán ra"
          - "khấu trừ tối đa bằng số thuế TTĐB tính ở khâu bán ra trong nước"
          - "người nộp thuế TTĐB là tổ chức, cá nhân sản xuất, gia công, nhập khẩu"
          - "đại lý bán đúng giá hưởng hoa hồng: giá tính theo giá do bên nhập khẩu quy định, chưa trừ hoa hồng"
        provisions:
          - 66/2025/QH15 Điều 4
          - 66/2025/QH15 Điều 9 khoản 3
          - 360/2025/NĐ-CP Điều 8 khoản 4
          - 360/2025/NĐ-CP Điều 5 khoản 1
      # phase 2: Law 90/2025 amends point a cl 1 Art 9 of 48/2024 from outside the corpus; the answer uses cl 3 (10%), which that amendment does not touch
      - question: Còn thuế GTGT khi bán cho đại lý thì sao?
        tax_type: vat
        form: plain
        answer: >
          Khi bán cho đại lý, doanh nghiệp tính thuế GTGT thuế suất 10% trên giá bán đã có thuế TTĐB nhưng chưa có
          thuế GTGT, và được khấu trừ thuế GTGT đầu vào đã nộp ở khâu nhập khẩu.
        key_facts:
          - "thuế suất GTGT 10%"
          - "giá tính thuế GTGT là giá bán đã có thuế TTĐB, chưa có thuế GTGT"
          - "được khấu trừ thuế GTGT đã nộp ở khâu nhập khẩu"
        provisions:
          - 48/2024/QH15 Điều 7 khoản 1
          - 48/2024/QH15 Điều 9 khoản 3
          - 48/2024/QH15 Điều 11 khoản 1
