  - id: q248  # step 2: repealed confirmed by 18/2026/TT-BTC Điều 9 khoản 2, which replaces 40/2021/TT-BTC
    question: Theo Thông tư 40/2021, hộ kinh doanh có doanh thu từ 100 triệu đồng một năm trở xuống thì không phải nộp thuế, đúng không?
