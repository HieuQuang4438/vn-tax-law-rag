  - id: q12  # phase 2: 181/2025 Art 26 cl 2 point g is amended by 144/2026/NĐ-CP Art 4 (instalment purchases); not listed because the answer does not rely on point g
    question: Mua hàng hóa giá trên 5 triệu mà trả bằng tiền mặt thì có được khấu trừ thuế GTGT đầu vào không?
    tax_type: vat
    form: plain
    answer: >
      Không. Hàng hóa, dịch vụ mua vào từ 05 triệu đồng trở lên (giá đã có thuế GTGT) phải có chứng từ
      thanh toán không dùng tiền mặt mới được khấu trừ thuế GTGT đầu vào; trả bằng tiền mặt (kể cả nộp
      tiền mặt vào tài khoản bên bán) thì không được khấu trừ. Mua của cùng một người bán nhiều lần trong
      một ngày, mỗi lần dưới 05 triệu nhưng tổng từ 05 triệu đồng trở lên, cũng phải thanh toán không dùng
      tiền mặt.
    key_facts:
      - "từ 05 triệu đồng trở lên (đã gồm thuế GTGT) phải có chứng từ thanh toán không dùng tiền mặt"
      - "nộp tiền mặt vào tài khoản bên bán không được coi là thanh toán không dùng tiền mặt"
      - "mua nhiều lần trong cùng một ngày tổng từ 05 triệu đồng trở lên cũng phải thanh toán không dùng tiền mặt"
    provisions:
      - 48/2024/QH15 Điều 14 khoản 2
      - 181/2025/NĐ-CP Điều 26
  - id: q13
    question: Theo Điều 9 Luật 67/2025, những khoản chi nào doanh nghiệp không được tính vào chi phí được trừ?
    tax_type: cit
    form: reference
    answer: >
      Khoản 2 Điều 9 liệt kê các khoản chi không được trừ, gồm: khoản chi không đáp ứng đủ điều kiện ở
      khoản 1 (thực tế phát sinh, liên quan đến sản xuất kinh doanh, có đủ hóa đơn, chứng từ thanh toán
      không dùng tiền mặt); tiền phạt vi phạm hành chính; khoản chi được bù đắp bằng nguồn khác; phần chi
      vượt mức Chính phủ quy định (lãi vay giao dịch liên kết, chi phúc lợi, bảo hiểm hưu trí, nhân thọ…);
      trích lập dự phòng, khấu hao, trích trước sai hoặc vượt mức; tiền lương của chủ doanh nghiệp tư nhân,
      chủ công ty TNHH một thành viên do cá nhân làm chủ, lương hạch toán nhưng không thực chi; lãi vay
      tương ứng vốn điều lệ còn thiếu; lãi vay của đối tượng không phải tổ chức tín dụng vượt mức Bộ luật Dân sự;
      thuế GTGT đầu vào đã khấu trừ, thuế TNDN,
      tiền chậm nộp; khoản tài trợ ngoài các khoản được phép; chi đầu tư xây dựng cơ bản trong giai đoạn đầu
      tư; và các khoản chi khác.
    key_facts:
      - "khoản tiền phạt do vi phạm hành chính"
      - "khấu hao tài sản cố định không đúng hoặc vượt mức quy định"
      - "lãi vay của đối tượng không phải tổ chức tín dụng vượt mức Bộ luật Dân sự; lãi vay tương ứng vốn điều lệ còn thiếu"
      - "tiền lương của chủ doanh nghiệp tư nhân, chủ công ty TNHH một thành viên do cá nhân làm chủ"
    provisions:
      - 67/2025/QH15 Điều 9 khoản 2
  - id: q14
    question: Tôi là người Hàn Quốc, công ty cử sang Việt Nam làm việc khoảng 4 tháng, thu nhập ở đây bị tính thuế như thế nào?
    tax_type: pit
    form: plain
    answer: >
      Tùy bạn là cá nhân cư trú hay không. Có mặt khoảng 4 tháng (dưới 183 ngày) và không có nơi ở thường
      xuyên tại Việt Nam thì là cá nhân không cư trú: thuế TNCN bằng 20% trên tổng tiền lương, tiền công
      nhận được do làm việc tại Việt Nam, không được giảm trừ gia cảnh, tổ chức trả thu nhập khấu trừ trước
      khi trả. Nếu có nơi ở thường xuyên (thường trú, hoặc nhà thuê để ở với hợp đồng thuê từ 183 ngày trở
      lên trong năm) thì là cá nhân cư trú và tính thuế theo biểu lũy tiến từng phần như người cư trú.
    key_facts:
      - "cá nhân cư trú: có mặt từ 183 ngày trở lên hoặc có nơi ở thường xuyên tại Việt Nam"
      - "cá nhân không cư trú: thuế suất 20% trên tiền lương, tiền công làm việc tại Việt Nam"
      - "thời gian làm việc dưới 183 ngày theo hợp đồng: tổ chức trả thu nhập khấu trừ theo mức của cá nhân không cư trú"
      - "cá nhân cư trú: tính theo biểu thuế lũy tiến từng phần"
    provisions:
      - 109/2025/QH15 Điều 2
      - 109/2025/QH15 Điều 21
      - 253/2026/NĐ-CP Điều 4
      - 253/2026/NĐ-CP Điều 64
      - 253/2026/NĐ-CP Điều 50 khoản 3
  - id: q16
    question: Điều 8 Luật 66/2025 quy định thuế suất tiêu thụ đặc biệt đối với bia tăng theo lộ trình thế nào?
    tax_type: sct
    form: reference
    answer: >
      Thuế suất TTĐB đối với bia tăng mỗi năm 5 điểm phần trăm: 65% từ 01/01/2026, 70% từ 01/01/2027,
      75% từ 01/01/2028, 80% từ 01/01/2029, 85% từ 01/01/2030 và 90% từ 01/01/2031.
    key_facts:
      - "65% từ 01/01/2026"
      - "70% từ 01/01/2027"
      - "90% từ 01/01/2031"
      - "tăng 5 điểm phần trăm mỗi năm"
    provisions:
      - 66/2025/QH15 Điều 8 khoản 1
      - 09/2026/QH16 Điều 4
  - id: q17
    question: Nghị định 68/2026 bắt buộc những hộ kinh doanh nào phải dùng hóa đơn điện tử khởi tạo từ máy tính tiền?
    tax_type: household
    form: reference
    answer: >
      Nghị định 68/2026 (khoản 5 Điều 8, đã sửa bởi Nghị định 141/2026) không bắt buộc riêng hóa đơn
      khởi tạo từ máy tính tiền: hộ kinh doanh, cá nhân kinh doanh có doanh thu năm trên 01 tỷ đồng phải
      áp dụng hóa đơn điện tử có mã của cơ quan thuế hoặc hóa đơn điện tử khởi tạo từ máy tính tiền có kết
      nối dữ liệu với cơ quan thuế. Hộ mới ra kinh doanh hoặc năm trước chưa trên 01 tỷ nhưng trong năm có
      doanh thu trên 01 tỷ đồng cũng phải áp dụng và đăng ký trong 30 ngày kể từ ngày cuối cùng của kỳ tính
      thuế có doanh thu lũy kế trên 01 tỷ đồng. Hộ có doanh thu từ 01 tỷ đồng trở xuống được tự nguyện đăng
      ký sử dụng. Riêng hóa đơn điện tử từ máy tính tiền do Nghị định 254/2026 (điểm c khoản 1 Điều 6) quy
      định: hộ kinh doanh bán hàng, cung cấp dịch vụ trực tiếp đến người tiêu dùng (bán lẻ, ăn uống, nhà
      hàng, khách sạn, vận tải hành khách…) sử dụng hóa đơn điện tử từ máy tính tiền.
    key_facts:
      - "doanh thu năm trên 01 tỷ đồng: bắt buộc hóa đơn điện tử có mã hoặc khởi tạo từ máy tính tiền"
      - "đăng ký trong 30 ngày kể từ ngày cuối cùng của kỳ tính thuế có doanh thu lũy kế trên 01 tỷ đồng"
      - "doanh thu năm từ 01 tỷ đồng trở xuống: tự nguyện đăng ký"
      - "bán trực tiếp đến người tiêu dùng (bán lẻ, ăn uống, nhà hàng, khách sạn, vận tải hành khách…): dùng hóa đơn điện tử từ máy tính tiền"
    provisions:
      - 68/2026/NĐ-CP Điều 8 khoản 5
      - 141/2026/NĐ-CP Điều 1
      - 254/2026/NĐ-CP Điều 6 khoản 1
  - id: q18
    question: Tôi là người nước ngoài mới sang Việt Nam làm việc theo hợp đồng 2 năm, tôi có cần đăng ký mã số thuế không, hay công ty làm giúp?
    tax_type: administration
    form: plain
    answer: >
      Công ty có thể làm thay: nếu bạn chưa đăng ký thuế, tổ chức chi trả thu nhập có trách nhiệm đăng ký thuế lần đầu thay cho bạn chậm nhất là ngày
      cuối cùng của thời hạn nộp hồ sơ khai thuế TNCN của kỳ đầu tiên chi trả thu nhập; đăng ký thay cho
      người phụ thuộc chậm nhất ngày 31/12 của năm tính thuế.
    key_facts:
      - "tổ chức chi trả thu nhập đăng ký thuế lần đầu thay cho cá nhân chưa đăng ký thuế"
      - "hạn: ngày cuối cùng của thời hạn nộp hồ sơ khai thuế TNCN của kỳ đầu tiên chi trả thu nhập"
      - "đăng ký thay cho người phụ thuộc chậm nhất ngày 31 tháng 12 của năm tính thuế"
    provisions:
      - 108/2025/QH15 Điều 10 khoản 3
      - 252/2026/NĐ-CP Điều 6 khoản 3
  - id: q20
    question: Doanh nghiệp xuất khẩu hàng hóa muốn được áp thuế suất GTGT 0% thì cần đáp ứng những điều kiện gì?
    tax_type: vat
    form: plain
    answer: >
      Hàng hóa xuất khẩu được áp thuế suất 0% phải có: hợp đồng bán, gia công hàng hóa xuất khẩu (hoặc
      hợp đồng ủy thác xuất khẩu); chứng từ thanh toán không dùng tiền mặt; tờ khai hải quan theo quy định.
      Để khấu trừ thuế GTGT đầu vào còn cần hóa đơn bán hàng, phiếu đóng gói, vận đơn, chứng từ bảo hiểm
      (nếu có).
    key_facts:
      - "hợp đồng bán, gia công hàng hóa xuất khẩu hoặc hợp đồng ủy thác xuất khẩu"
      - "chứng từ thanh toán không dùng tiền mặt"
      - "tờ khai hải quan"
    provisions:
      - 48/2024/QH15 Điều 9 khoản 1  # review: amended from outside the corpus (Law 90/2025, point a); the answer uses only "exported goods take 0%"
      - 181/2025/NĐ-CP Điều 18
      - 48/2024/QH15 Điều 14 khoản 2
  - id: q21  # phase 2: Arts 12, 13, 14 of 67/2025 have outside-corpus amendments (Law 133/2025 Art 25 cl 7; Law 141/2025; Law 143/2025). They touch points a, e, h of Art 12 cl 2, Art 13 cl 1a, 4d, 7 and Art 14 cl 1 point a and cl 4; the 10%/15-year rate (Art 13 cl 1) is untouched, but the 4-year/9-year exemption (Art 14 cl 1 point a) and its start year (cl 4) may differ in the law in force; owner to verify
    question: Công ty mới thành lập để sản xuất linh kiện điện tử trong khu công nghiệp thì có được miễn, giảm thuế thu nhập doanh nghiệp không, được mấy năm?
    tax_type: cit
    form: plain
    answer: >
      Khu công nghiệp không phải địa bàn ưu đãi thuế TNDN; ưu đãi phụ thuộc ngành nghề. Nếu dự án đầu tư
      mới sản xuất thiết bị điện tử theo pháp luật về công nghiệp công nghệ số, hoặc sản xuất sản phẩm công
      nghiệp hỗ trợ ưu tiên đáp ứng tiêu chí của Luật, thì được thuế suất 10% trong 15 năm, miễn thuế tối đa
      04 năm và giảm 50% số thuế phải nộp tối đa 09 năm tiếp theo, tính từ năm đầu tiên có thu nhập chịu
      thuế từ dự án. Nếu không thuộc ngành nghề hay địa bàn ưu đãi thì không được miễn, giảm.
    key_facts:
      - "khu công nghiệp không thuộc địa bàn ưu đãi thuế TNDN"
      - "thuế suất 10% trong 15 năm"
      - "miễn thuế tối đa 04 năm, giảm 50% tối đa 09 năm tiếp theo"
      - "thời gian miễn, giảm tính từ năm đầu tiên có thu nhập chịu thuế từ dự án"
    provisions:
      - 67/2025/QH15 Điều 12
      - 67/2025/QH15 Điều 13
      - 67/2025/QH15 Điều 14
  - id: q22
    question: Biểu thuế lũy tiến từng phần theo Luật 109/2025 có mấy bậc, bậc cao nhất là bao nhiêu phần trăm?
    tax_type: pit
    form: reference
    answer: >
      Biểu thuế lũy tiến từng phần có 5 bậc; bậc cao nhất là 35%, áp dụng cho phần thu nhập tính thuế
      trên 1.200 triệu đồng/năm (trên 100 triệu đồng/tháng).
    key_facts:
      - "5 bậc"
      - "bậc cao nhất 35%"
      - "trên 1.200 triệu đồng/năm (trên 100 triệu đồng/tháng)"
    provisions:
      - 109/2025/QH15 Điều 9
  - id: q23  # phase 2: repealed confirmed. Decree 254/2026/NĐ-CP Art 44 cl 3: invoices printed to order by the tax authority lose validity when the decree takes effect; Art 6 makes e-invoices the rule. No paper-invoice issuance notice remains in the corpus
    question: Công ty muốn đặt in hóa đơn giấy thì phải gửi thông báo phát hành hóa đơn cho cơ quan thuế trước bao nhiêu ngày?
    tax_type: administration
    form: plain
    answer: >
      Quy định đặt in hóa đơn giấy và thông báo phát hành hóa đơn không còn áp dụng: doanh nghiệp phải dùng
      hóa đơn điện tử, và hóa đơn đặt in của cơ quan thuế đã hết giá trị sử dụng từ ngày Nghị định
      254/2026/NĐ-CP có hiệu lực.
    unanswerable: repealed
  - id: q24
    question: Nhập khẩu ô tô 7 chỗ về bán thì giá tính thuế tiêu thụ đặc biệt được xác định thế nào?
    tax_type: sct
    form: plain
    answer: >
      Ở khâu nhập khẩu, giá tính thuế TTĐB là trị giá tính thuế nhập khẩu cộng thuế nhập khẩu (và thuế nhập
      khẩu bổ sung nếu có), không gồm số thuế nhập khẩu được miễn, giảm. Khi bán ra trong nước, giá tính
      thuế = (giá bán chưa có thuế GTGT − thuế bảo vệ môi trường nếu có) / (1 + thuế suất TTĐB), và được khấu
      trừ số thuế TTĐB đã nộp ở khâu nhập khẩu tương ứng với số xe bán ra. Nếu bán cho doanh nghiệp thương
      mại có quan hệ liên kết, giá bán làm căn cứ không được thấp hơn 7% so với giá bình quân của các doanh
      nghiệp thương mại mua trực tiếp.
    key_facts:
      - "khâu nhập khẩu: trị giá tính thuế nhập khẩu + thuế nhập khẩu (+ thuế nhập khẩu bổ sung)"
      - "khâu bán ra: giá bán chưa có thuế GTGT chia (1 + thuế suất TTĐB)"
      - "được khấu trừ số thuế TTĐB đã nộp ở khâu nhập khẩu"
      - "bán cho doanh nghiệp thương mại liên kết: không thấp hơn 7% so với giá bình quân"
    provisions:
      - 66/2025/QH15 Điều 6 khoản 1
      - 66/2025/QH15 Điều 9 khoản 3
      - 360/2025/NĐ-CP Điều 5 khoản 1
      - 360/2025/NĐ-CP Điều 8 khoản 4
  - id: q27  # phase 2: 181/2025 Art 4 cl 4 is amended by 144/2026/NĐ-CP Art 1 only in point đ (debt sales); not listed because the answer relies on point d (securities transfers)
    question: Bán cổ phiếu trên sàn chứng khoán thì có phải chịu thuế giá trị gia tăng không?
    tax_type: vat
    form: plain
    answer: >
      Không. Chuyển nhượng chứng khoán, bao gồm chuyển nhượng qua hệ thống giao dịch của Sở giao dịch chứng
      khoán, thuộc chuyển nhượng vốn, là đối tượng không chịu thuế GTGT.
    key_facts:
      - "chuyển nhượng chứng khoán thuộc đối tượng không chịu thuế GTGT"
      - "bao gồm chuyển nhượng qua hệ thống giao dịch của Sở giao dịch chứng khoán"
    provisions:
      - 48/2024/QH15 Điều 5 khoản 9
      - 181/2025/NĐ-CP Điều 4 khoản 4
      - 77/2025/TT-BTC Điều 4
  - id: q28
    question: Theo Nghị định 254/2026, thời điểm lập hóa đơn điện tử khi bán hàng là lúc giao hàng hay lúc nhận tiền?
    tax_type: administration
    form: reference
    answer: >
      Lúc giao hàng: thời điểm lập hóa đơn khi bán hàng hóa là thời điểm chuyển giao quyền sở hữu hoặc quyền
      sử dụng hàng hóa cho người mua, không phân biệt đã thu được tiền hay chưa.
    key_facts:
      - "thời điểm chuyển giao quyền sở hữu hoặc quyền sử dụng hàng hóa cho người mua"
      - "không phân biệt đã thu được tiền hay chưa"
    provisions:
      - 254/2026/NĐ-CP Điều 9 khoản 1
  - id: q29  # phase 2: Thông tư 20/2026 named in the question has no provision on salary costs (it covers dossiers for points b and c of Art 9 cl 1 of the CIT Law); the answer is in 320/2025/NĐ-CP Điều 10 khoản 8 and 67/2025/QH15 Điều 9 khoản 2
    question: Thông tư 20/2026 yêu cầu khoản chi tiền lương cho người lao động phải đáp ứng điều kiện gì mới được trừ khi tính thuế TNDN?
    tax_type: cit
    form: reference
    answer: >
      Thông tư 20/2026 không quy định riêng về tiền lương; điều kiện nằm ở Luật 67/2025 và Nghị định
      320/2025. Tiền lương, tiền công, tiền thưởng được trừ khi thực tế chi trả, có chứng từ thanh toán, và
      điều kiện, mức được hưởng được ghi cụ thể tại hợp đồng lao động, thỏa ước lao động tập thể, quy chế tài
      chính hoặc quy chế thưởng. Không được trừ: lương đã hạch toán nhưng không chi hoặc không có chứng từ;
      lương hết hạn nộp hồ sơ quyết toán năm mà chưa chi (trừ khi có quỹ lương dự phòng); lương của chủ doanh
      nghiệp tư nhân, chủ công ty TNHH một thành viên do một cá nhân làm chủ.
    key_facts:
      - "điều kiện và mức được hưởng ghi tại hợp đồng lao động, thỏa ước lao động tập thể, quy chế tài chính hoặc quy chế thưởng"
      - "thực tế chi trả và có chứng từ thanh toán"
      - "chưa chi khi hết thời hạn nộp hồ sơ quyết toán năm thì không được trừ, trừ trường hợp có quỹ lương dự phòng"
      - "không trừ lương của chủ doanh nghiệp tư nhân, chủ công ty TNHH một thành viên do cá nhân làm chủ"
    provisions:
      - 320/2025/NĐ-CP Điều 10 khoản 8
      - 67/2025/QH15 Điều 9 khoản 2
  - id: q31
    question: Theo Nghị định 253/2026, tiền công ty hỗ trợ ăn trưa cho nhân viên có bị tính vào thu nhập chịu thuế không?
    tax_type: pit
    form: reference
    answer: >
      Tiền ăn giữa ca, ăn trưa người sử dụng lao động chi bằng tiền chỉ tính vào thu nhập chịu thuế phần
      vượt quá 1,2 triệu đồng/người/tháng. Nếu công ty tự tổ chức bữa ăn (nấu ăn, mua suất ăn, cấp phiếu ăn)
      thì không tính vào thu nhập chịu thuế.
    key_facts:
      - "phần vượt 1,2 triệu đồng/người/tháng tính vào thu nhập chịu thuế"
      - "công ty tự tổ chức bữa ăn (nấu ăn, mua suất ăn, cấp phiếu ăn) thì không tính"
    provisions:
      - 253/2026/NĐ-CP Điều 8 khoản 2
  - id: q32
    question: Công ty con vay tiền của công ty mẹ ở nước ngoài thì chi phí lãi vay có bị giới hạn khi tính thuế không?
    tax_type: cit
    form: plain
    answer: >
      Có. Công ty mẹ nắm giữ từ 25% vốn trở lên là bên liên kết, nên tổng chi phí lãi vay (sau khi trừ lãi
      tiền gửi và lãi cho vay) được trừ không vượt quá 30% của tổng lợi nhuận thuần từ hoạt động kinh doanh
      cộng chi phí lãi vay (sau khi trừ lãi tiền gửi, lãi cho vay) cộng chi phí khấu hao trong kỳ. Phần lãi
      vay không được trừ được chuyển sang kỳ sau, tối đa 05 năm liên tục.
    key_facts:
      - "bên nắm giữ trực tiếp hoặc gián tiếp ít nhất 25% vốn là bên liên kết"
      - "chi phí lãi vay được trừ không vượt quá 30% của lợi nhuận thuần + chi phí lãi vay + chi phí khấu hao"
      - "phần không được trừ được chuyển sang kỳ sau, không quá 05 năm"
