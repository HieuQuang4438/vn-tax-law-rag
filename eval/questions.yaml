    form: reference
    answer: >
      Thông tư 40/2021/TT-BTC đã bị Thông tư 18/2026/TT-BTC thay thế nên không áp dụng nữa. Hiện nay hộ kinh doanh có doanh
      thu năm từ 01 tỷ đồng trở xuống không phải nộp thuế GTGT, TNCN (Nghị định 68/2026/NĐ-CP, sửa bởi Nghị định
      141/2026/NĐ-CP).
