  - id: q247
    question: Lớp tập huấn miễn phí về thuế cho hộ kinh doanh ở Hà Nội tháng tới tổ chức ở đâu?
    tax_type: household
    form: plain
    answer: Các văn bản trong bộ dữ liệu không có thông tin về lịch hay địa điểm tập huấn thuế; chúng chỉ quy định cơ quan thuế có trách nhiệm hướng dẫn, hỗ trợ hộ kinh doanh.
