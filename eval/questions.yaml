      suất gửi Tờ khai Mẫu số 02/CNKD-TNCN-QTT. Hồ sơ nộp tại cơ quan thuế nơi nộp hồ sơ khai thuế.
    key_facts:
      - "phương pháp tỷ lệ trên doanh thu dùng Mẫu số 01/TKN-CNKD"
