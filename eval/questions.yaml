  - id: q237  # step 2: moved to unanswerable; 68/2026/NĐ-CP lets households choose a method (Điều 4 khoản 5) but sets no notice or deadline for the choice
    question: Theo Nghị định 68/2026, hộ kinh doanh có doanh thu trên ngưỡng phải thông báo phương pháp tính thuế cho cơ quan thuế khi nào?
    tax_type: household
    form: reference
    answer: >
      Nghị định 68/2026/NĐ-CP không quy định thủ tục hay thời hạn thông báo phương pháp tính thuế. Nghị định chỉ cho hộ có
      doanh thu trên 01 tỷ đến 03 tỷ đồng chọn phương pháp, buộc áp dụng ổn định 02 năm với phương pháp thu nhập tính thuế,
      và quy định khai thuế theo quý.
    unanswerable: out_of_scope
    added_in: 2
  - id: q238
    question: Nghị định 141/2026 thay đổi gì về ngưỡng doanh thu phải nộp thuế của hộ kinh doanh?
    tax_type: household
    form: reference
    answer: >
      Nghị định 141/2026/NĐ-CP nâng ngưỡng doanh thu năm không phải nộp thuế GTGT, TNCN của hộ kinh doanh từ 500 triệu đồng
      lên 01 tỷ đồng, bằng cách sửa cụm từ "500 triệu đồng" thành "01 tỷ đồng" trong Nghị định 68/2026/NĐ-CP. Thay đổi áp
      dụng từ 01/01/2026. Hộ có doanh thu từ 01 tỷ đồng trở xuống đã kê khai, nộp thuế thì được xử lý số thuế đã nộp như
      tiền nộp thừa.
    key_facts:
      - "ngưỡng nâng từ 500 triệu đồng lên 01 tỷ đồng"
      - "áp dụng từ 01/01/2026"
      - "thuế đã nộp của hộ từ 01 tỷ đồng trở xuống được xử lý nộp thừa"
    provisions:
      - 141/2026/NĐ-CP Điều 1
      - 141/2026/NĐ-CP Điều 3
      - 141/2026/NĐ-CP Điều 4
    added_in: 2
  - id: q239  # step 2: 89/2026/TT-BTC Điều 99 khoản 4 listed because it repeals parts of 18/2026/TT-BTC Điều 4 (khoản 2 điểm a, c and khoản 3), not the parts used
    question: Thông tư 18/2026 quy định hộ kinh doanh dùng tờ khai thuế mẫu số mấy?
    tax_type: household
    form: reference
    answer: >
      Hộ kinh doanh dưới ngưỡng thông báo doanh thu theo Mẫu số 01/TKN-CNKD. Hộ nộp thuế (cả hai phương pháp) khai thuế GTGT,
      TNCN theo Mẫu số 01/CNKD; hộ nộp theo thu nhập tính thuế khai quyết toán TNCN theo Mẫu số 02/CNKD-TNCN-QTT. Cá nhân cho
      thuê bất động sản tự khai dùng Mẫu số 01/BĐS. Thông tư 50/2026/TT-BTC thay thế các mẫu 01/TKN-CNKD, 01/CNKD, 01/BĐS bằng
      mẫu mới cùng số hiệu.
    key_facts:
      - "Mẫu số 01/CNKD để khai thuế GTGT, TNCN"
      - "Mẫu số 01/TKN-CNKD để thông báo doanh thu"
      - "Mẫu số 02/CNKD-TNCN-QTT để quyết toán TNCN"
    provisions:
      - 18/2026/TT-BTC Điều 4
      - 89/2026/TT-BTC Điều 99 khoản 4
      - 50/2026/TT-BTC Điều 3
    added_in: 2
  - id: q240  # step 2: the question names 50/2026/TT-BTC, but the channels are in 68/2026/NĐ-CP Điều 8 khoản 4 điểm a
    question: Theo Thông tư 50/2026, hộ kinh doanh được nộp hồ sơ khai thuế qua những kênh nào?
    tax_type: household
    form: reference
    answer: >
      Hộ kinh doanh nộp hồ sơ khai thuế bằng phương thức điện tử. Người có hoàn cảnh đặc biệt (người cao tuổi, người khuyết
      tật, người thuộc diện bảo trợ xã hội, người ở địa bàn đặc biệt khó khăn hoặc bất khả kháng) không thể giao dịch điện tử
      thì nộp trực tiếp hoặc qua bưu chính đến Trung tâm Phục vụ hành chính công cấp xã. Quy định này nằm ở Nghị định
      68/2026/NĐ-CP; Thông tư 50/2026/TT-BTC không quy định kênh nộp.
    key_facts:
      - "nộp hồ sơ khai thuế bằng phương thức điện tử"
      - "người có hoàn cảnh đặc biệt nộp trực tiếp hoặc qua bưu chính"
      - "nộp tại Trung tâm Phục vụ hành chính công cấp xã"
    provisions:
      - 68/2026/NĐ-CP Điều 8 khoản 4
    added_in: 2
  - id: q241  # step 2: 50/2026/TT-BTC Điều 2 replaces the form in 18/2026/TT-BTC Điều 5 khoản 2; 141/2026/NĐ-CP Điều 1 listed because it amends 68/2026/NĐ-CP Điều 12
    question: Thông tư 18/2026 quy định hộ kinh doanh nộp thừa tiền thuế muốn xin hoàn thì gửi hồ sơ gì?
    tax_type: household
    form: reference
