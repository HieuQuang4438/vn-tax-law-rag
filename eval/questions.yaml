conversations:
  - id: c01
    turns:
      - question: Công ty trả lương cho nhân viên thì phải khấu trừ thuế thu nhập cá nhân hằng tháng phải không?
        tax_type: pit
        form: plain
        answer: >
          Đúng. Với người lao động ký hợp đồng từ 03 tháng trở lên, công ty khấu trừ thuế TNCN khi trả thu nhập,
          căn cứ thu nhập tính thuế tháng và biểu thuế lũy tiến từng phần.
        key_facts:
          - "hợp đồng lao động từ 03 tháng trở lên: khấu trừ theo biểu thuế lũy tiến từng phần"
          - "căn cứ thu nhập tính thuế tháng"
        provisions:
          - 253/2026/NĐ-CP Điều 50 khoản 1
          - 253/2026/NĐ-CP Điều 50 khoản 2
      - question: Còn trả cho cộng tác viên làm thời vụ, không ký hợp đồng lao động thì khấu trừ bao nhiêu?
        tax_type: pit
        form: plain
        answer: >
          Trả cho cá nhân cư trú không ký hợp đồng (hoặc hợp đồng dưới 03 tháng) từ 05 triệu đồng/lần trở lên thì
          khấu trừ 10% trên thu nhập trước khi trả; dưới 05 triệu đồng/lần thì chỉ khấu trừ 10% khi cá nhân yêu
          cầu. Nếu cá nhân chỉ có thu nhập này và ước tính chưa đến mức chịu thuế sau giảm trừ gia cảnh thì làm cam
          kết để công ty tạm thời không khấu trừ.
        key_facts:
          - "từ 05 triệu đồng/lần trở lên: khấu trừ 10%"
          - "dưới 05 triệu đồng/lần: khấu trừ 10% khi cá nhân yêu cầu"
          - "cá nhân chưa đến mức chịu thuế làm cam kết để tạm không khấu trừ"
        provisions:
          - 253/2026/NĐ-CP Điều 50 khoản 2
      - question: Nếu công ty quên không khấu trừ khoản đó thì bị xử lý thế nào?
        tax_type: administration
        form: plain
        answer: >
          Tổ chức có trách nhiệm khấu trừ mà nộp không đầy đủ, không đúng thời hạn thì phải nộp tiền chậm nộp
          thay cho người nộp thuế, mức 0,03%/ngày trên số tiền chậm nộp. Cá nhân nhận thu nhập chưa bị khấu trừ thì
          phải tự kê khai, nộp thuế.
        key_facts:
          - "tổ chức khấu trừ nộp thiếu, chậm phải nộp tiền chậm nộp thay người nộp thuế"
          - "tiền chậm nộp 0,03%/ngày"
          - "cá nhân chưa bị khấu trừ phải tự kê khai, nộp thuế"
        provisions:
          - 108/2025/QH15 Điều 16 khoản 1
          - 108/2025/QH15 Điều 16 khoản 2
          - 253/2026/NĐ-CP Điều 67 khoản 5
  - id: c02
    turns:
      - question: Hộ kinh doanh bán tạp hóa doanh thu khoảng 800 triệu một năm thì nộp thuế GTGT theo tỷ lệ bao nhiêu?
        tax_type: household
        form: plain
        answer: >
          Doanh thu 800 triệu đồng/năm (từ 01 tỷ đồng trở xuống) thì hộ kinh doanh không chịu thuế GTGT, chỉ thông
          báo doanh thu thực tế với cơ quan thuế chậm nhất ngày 31/01 năm sau. Nếu doanh thu năm trên 01 tỷ đồng,
          hoạt động phân phối, cung cấp hàng hóa như bán tạp hóa tính thuế GTGT theo tỷ lệ 1% trên doanh thu.
        key_facts:
          - "doanh thu năm từ 01 tỷ đồng trở xuống: không chịu thuế GTGT"
          - "thông báo doanh thu thực tế chậm nhất ngày 31 tháng 01 năm sau"
          - "trên 01 tỷ đồng: phân phối, cung cấp hàng hóa 1%"
        provisions:
          - 68/2026/NĐ-CP Điều 3
          - 68/2026/NĐ-CP Điều 8 khoản 1
          - 141/2026/NĐ-CP Điều 1
          - 48/2024/QH15 Điều 12
          - 149/2025/QH15 Điều 1
      # review: the food-and-drink group is in Annex I of Circular 69/2025, which is not indexed
      # (corpus.md, "Annexes are not indexed"); kept on purpose as a test of that gap.
      - question: Nếu chuyển sang bán đồ ăn uống thì tỷ lệ có khác không?
        tax_type: household
        form: plain
        answer: >
          Với doanh thu 800 triệu đồng/năm thì không khác: vẫn không chịu thuế GTGT, bất kể ngành nghề. Chỉ khi doanh
          thu trên 01 tỷ đồng, tỷ lệ mới theo nhóm hoạt động: phân phối hàng hóa 1%; sản xuất, vận tải, dịch vụ có
          gắn với hàng hóa 3%; dịch vụ 5%; hoạt động khác 2%. Nhóm cụ thể của dịch vụ ăn uống được quy định tại
          Phụ lục I Thông tư 69/2025/TT-BTC; nội dung phụ lục không có trong phần văn bản tra cứu được.
        key_facts:
          - "doanh thu năm từ 01 tỷ đồng trở xuống: không chịu thuế GTGT ở mọi ngành nghề"
          - "sản xuất, vận tải, dịch vụ có gắn với hàng hóa: 3%"
          - "dịch vụ: 5%"
          - "hoạt động kinh doanh khác: 2%"
        provisions:
          - 68/2026/NĐ-CP Điều 3
          - 141/2026/NĐ-CP Điều 1
          - 48/2024/QH15 Điều 12
          - 149/2025/QH15 Điều 1
          - 69/2025/TT-BTC Điều 5
  - id: c03
    turns:
      - question: Điều 10 Luật 67/2025 quy định thuế suất thuế thu nhập doanh nghiệp phổ thông là bao nhiêu?
        tax_type: cit
        form: reference
        answer: >
          Thuế suất thuế TNDN phổ thông là 20%, trừ doanh nghiệp có tổng doanh thu năm không quá 03 tỷ đồng (15%),
          từ trên 03 tỷ đến không quá 50 tỷ đồng (17%) và các trường hợp riêng hoặc được ưu đãi.
        key_facts:
          - "thuế suất phổ thông 20%"
          - "doanh thu năm không quá 03 tỷ đồng: 15%"
          - "trên 03 tỷ đến không quá 50 tỷ đồng: 17%"
        provisions:
          - 67/2025/QH15 Điều 10
