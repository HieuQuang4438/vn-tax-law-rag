          - "thông báo tiếp nhận trong 03 ngày làm việc"
          - "hoàn trước: chậm nhất 06 ngày làm việc kể từ thông báo tiếp nhận"
          - "kiểm tra trước hoàn: chậm nhất 10 ngày làm việc kể từ kết luận kiểm tra"
