          nộp thay thuế cho cá nhân.
        key_facts:
          - "doanh nghiệp đa cấp khấu trừ thuế trước khi chi trả"
          - "khai thay, nộp thay thuế cho cá nhân"
        provisions:
          - 253/2026/NĐ-CP Điều 67
          - 68/2026/NĐ-CP Điều 8 khoản 7
      # step 2: 09/2026/QH16 Điều 1 listed because it amends 109/2025/QH15 Điều 7 khoản 1
      - question: Mức khấu trừ đó là bao nhiêu phần trăm?
        tax_type: pit
        form: plain
        answer: >
          Thuế suất 5% trên doanh thu tính thuế, theo mức áp dụng cho đại lý bán hàng đa cấp tại khoản 3 Điều 7 Luật Thuế TNCN.
        key_facts:
          - "thuế suất 5% trên doanh thu tính thuế"
