        tax_type: pit
        form: plain
        answer: >
          Ủy quyền cho công ty mới được khi bạn có hợp đồng lao động từ 03 tháng trở lên và đang làm việc ở đó vào thời điểm
          quyết toán, và chỉ có một nguồn tiền lương tại công ty mới. Thu nhập từ công ty cũ là nguồn thứ hai, nên bạn phải tự
          quyết toán, trừ khi chuyển từ công ty cũ sang do sáp nhập, hợp nhất, chia, tách, chuyển đổi hoặc hai công ty cùng một
          hệ thống.
