  - id: q243
    question: Ở Thái Lan người bán hàng rong có phải nộp thuế không?
    tax_type: household
    form: plain
    answer: Các văn bản trong bộ dữ liệu chỉ quy định thuế của Việt Nam, không có thông tin về Thái Lan.
    unanswerable: out_of_scope
    added_in: 2
  - id: q244
    question: Năm 2025 cả nước có bao nhiêu hộ kinh doanh chuyển lên thành doanh nghiệp?
    tax_type: household
    form: plain
    answer: Các văn bản trong bộ dữ liệu là văn bản quy phạm pháp luật, không có số liệu thống kê về hộ kinh doanh chuyển lên doanh nghiệp.
    unanswerable: out_of_scope
    added_in: 2
  - id: q245
    question: Phần mềm bán hàng KiotViet có tự gửi dữ liệu hóa đơn sang cơ quan thuế không?
    tax_type: household
    form: plain
    answer: Các văn bản trong bộ dữ liệu không nói về phần mềm bán hàng cụ thể; chúng chỉ quy định hóa đơn điện tử khởi tạo từ máy tính tiền phải kết nối dữ liệu với cơ quan thuế.
