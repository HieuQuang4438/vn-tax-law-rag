  - id: c07
    added_in: 2
    turns:
      - question: Công ty mình đổi người đại diện theo pháp luật thì có phải báo cho cơ quan thuế không?
        tax_type: administration
        form: plain
        answer: >
          Không phải làm thủ tục riêng với cơ quan thuế. Doanh nghiệp đăng ký thuế cùng với đăng ký doanh nghiệp theo cơ chế một
          cửa liên thông; thông tin thay đổi đăng ký với cơ quan đăng ký kinh doanh được chuyển sang cơ quan thuế. Doanh nghiệp
          chỉ phải bổ sung thông tin nếu cơ quan thuế thông báo thông tin liên thông chưa đầy đủ.
        key_facts:
          - "đăng ký thuế theo cơ chế một cửa liên thông với đăng ký doanh nghiệp"
          - "không phải làm thủ tục đăng ký thuế trực tiếp với cơ quan thuế"
          - "bổ sung khi cơ quan thuế thông báo thông tin chưa đầy đủ"
        provisions:
          - 108/2025/QH15 Điều 10
          - 252/2026/NĐ-CP Điều 6 khoản 1
          - 252/2026/NĐ-CP Điều 7 khoản 1
      - question: Nếu chỉ đổi số điện thoại liên hệ thôi thì sao?
        tax_type: administration
        form: plain
        answer: >
          Số điện thoại đăng ký giao dịch thuế điện tử thay đổi thì doanh nghiệp phải cập nhật trong 03 ngày làm việc kể từ ngày
          thay đổi, theo mẫu số 01/ĐK-TĐT (khi đăng ký qua Hệ thống thông tin quản lý thuế). Nếu có giao dịch điện tử với cơ quan
          thuế trước thời hạn đó thì phải cập nhật trước khi giao dịch.
        key_facts:
          - "cập nhật trong 03 ngày làm việc kể từ ngày thay đổi"
          - "mẫu số 01/ĐK-TĐT"
          - "phải cập nhật trước khi giao dịch điện tử nếu giao dịch sớm hơn"
        provisions:
          - 89/2026/TT-BTC Điều 13
  - id: c08
    added_in: 2
    turns:
      - question: Doanh nghiệp nợ thuế thì cơ quan thuế có được phong tỏa tài khoản ngân hàng của công ty không?
        tax_type: administration
        form: plain
        answer: >
          Được. Phong tỏa tài khoản, trích tiền từ tài khoản là biện pháp cưỡng chế, áp dụng khi doanh nghiệp nợ thuế quá 90 ngày
          kể từ hết thời hạn nộp, nợ khi hết thời hạn gia hạn, không hoạt động tại địa chỉ đăng ký hoặc phát tán tài sản. Chưa
          cưỡng chế khi tổng tiền thuế nợ của tổ chức không quá 3.000.000 đồng.
        key_facts:
          - "phong tỏa tài khoản là biện pháp cưỡng chế nợ thuế"
          - "áp dụng khi nợ thuế quá 90 ngày kể từ hết thời hạn nộp"
          - "chưa cưỡng chế khi nợ của tổ chức không quá 3.000.000 đồng"
        provisions:
          - 108/2025/QH15 Điều 48
          - 108/2025/QH15 Điều 49
          - 252/2026/NĐ-CP Điều 65
      - question: Trước khi làm vậy họ có phải gửi thông báo cho công ty không?
        tax_type: administration
        form: plain
        answer: >
          Có. Sau 30 ngày kể từ hết thời hạn nộp mà công ty chưa nộp, cơ quan thuế thông báo số tiền thuế nợ và số ngày chậm
          nộp; hằng tháng cơ quan thuế còn thông báo tiền thuế nợ, tiền chậm nộp theo mẫu số 01/NVT qua tài khoản giao dịch thuế
          điện tử. Cưỡng chế chỉ áp dụng khi nợ quá 90 ngày. Quyết định cưỡng chế phải được gửi cho doanh nghiệp bằng phương
          thức điện tử (hoặc thư bảo đảm, gửi trực tiếp) và đăng trên trang thông tin điện tử ngành thuế ngay trong ngày ban
          hành; quyết định có hiệu lực từ ngày ký.
        key_facts:
          - "sau 30 ngày kể từ hết hạn nộp, cơ quan thuế thông báo số tiền thuế nợ và số ngày chậm nộp"
          - "hằng tháng thông báo tiền thuế nợ theo mẫu số 01/NVT"
          - "quyết định cưỡng chế gửi doanh nghiệp ngay trong ngày ban hành"
          - "có hiệu lực từ ngày ký"
        provisions:
          - 108/2025/QH15 Điều 16 khoản 4
          - 89/2026/TT-BTC Điều 39 khoản 2
          - 108/2025/QH15 Điều 49
          - 252/2026/NĐ-CP Điều 65
      - question: Nộp đủ tiền rồi thì bao lâu tài khoản được gỡ?
        tax_type: administration
        form: plain
        answer: >
          Quyết định cưỡng chế chấm dứt hiệu lực khi tiền thuế nợ đã được nộp đủ. Cơ quan thuế thông báo bằng phương thức điện tử
          cho ngân hàng về việc đã nộp đủ để dừng trích chuyển, và quyết định chấm dứt cưỡng chế được gửi ngay trong ngày ban
          hành. Các văn bản không quy định số ngày cụ thể để ban hành quyết định chấm dứt.
        key_facts:
          - "quyết định cưỡng chế chấm dứt hiệu lực khi đã nộp đủ tiền"
          - "cơ quan thuế thông báo điện tử cho ngân hàng để dừng trích chuyển"
          - "quyết định chấm dứt cưỡng chế gửi ngay trong ngày ban hành"
        provisions:
          - 108/2025/QH15 Điều 49
          - 252/2026/NĐ-CP Điều 65
          - 252/2026/NĐ-CP Điều 66
  - id: c09
    added_in: 2
    turns:
      - question: Khách hàng chuyển tiền đặt cọc mua hàng thì công ty có phải xuất hóa đơn điện tử ngay lúc nhận cọc không?
        tax_type: administration
        form: plain
        answer: >
          Không. Với bán hàng hóa, thời điểm lập hóa đơn là thời điểm chuyển giao quyền sở hữu hoặc quyền sử dụng hàng hóa cho
          người mua, không phân biệt đã thu tiền hay chưa. Với dịch vụ, thu tiền đặt cọc để bảo đảm thực hiện hợp đồng cũng không
          phải là thời điểm lập hóa đơn.
        key_facts:
          - "lập hóa đơn khi chuyển giao quyền sở hữu hàng hóa"
          - "nhận tiền đặt cọc không phải là thời điểm lập hóa đơn"
        provisions:
          - 254/2026/NĐ-CP Điều 9 khoản 1
          - 254/2026/NĐ-CP Điều 9 khoản 2
      - question: Vậy số tiền cọc đó có phải kê khai thuế GTGT ở kỳ nhận tiền không?
        tax_type: vat
        form: plain
        answer: >
          Không. Thời điểm xác định thuế GTGT với hàng hóa là thời điểm chuyển giao quyền sở hữu hoặc quyền sử dụng hàng hóa cho
          người mua hoặc thời điểm lập hóa đơn, không phân biệt đã thu tiền hay chưa. Tiền đặt cọc chưa phải kê khai ở kỳ nhận tiền.
        key_facts:
          - "thuế GTGT xác định khi chuyển giao quyền sở hữu hoặc lập hóa đơn"
          - "tiền đặt cọc không kê khai ở kỳ nhận tiền"
        provisions:
          - 48/2024/QH15 Điều 8
  - id: c10
    added_in: 2
    turns:
      # step 2: 149/2025/QH15 Điều 1 listed because it amends 48/2024/QH15 Điều 9
      - question: Công ty mình bán máy cày, máy gặt cho nông dân thì chịu thuế GTGT bao nhiêu?
        tax_type: vat
        form: plain
        answer: >
          Máy cày, máy thu hoạch lúa (máy gặt) là máy móc, thiết bị chuyên dùng phục vụ sản xuất nông nghiệp, chịu thuế suất
          thuế GTGT 5%.
        key_facts:
          - "máy cày, máy gặt chịu thuế suất 5%"
        provisions:
          - 48/2024/QH15 Điều 9 khoản 2
          - 149/2025/QH15 Điều 1
          - 181/2025/NĐ-CP Điều 19
      # step 2: moved to unanswerable; 181/2025/NĐ-CP Điều 19 khoản 6 lists machines only and the corpus is silent on their parts
      - question: Thế còn linh kiện, phụ tùng thay thế cho mấy máy đó thì sao?
        tax_type: vat
        form: plain
        answer: >
          Danh mục máy móc chuyên dùng phục vụ sản xuất nông nghiệp chịu thuế suất 5% chỉ liệt kê các loại máy, không nhắc đến
          linh kiện, phụ tùng thay thế; các văn bản trong bộ dữ liệu không quy định thuế suất riêng cho phụ tùng của các máy này.
        unanswerable: out_of_scope
  - id: c11
    added_in: 2
    turns:
      - question: Công ty mua hàng của hộ kinh doanh không có hóa đơn thì có được khấu trừ thuế GTGT đầu vào không?
        tax_type: vat
        form: plain
        answer: >
          Không. Muốn khấu trừ thuế GTGT đầu vào phải có hóa đơn GTGT mua hàng hóa, dịch vụ và chứng từ thanh toán không dùng
          tiền mặt với khoản từ 05 triệu đồng trở lên. Mua của hộ kinh doanh không có hóa đơn GTGT thì không có thuế đầu vào để
          khấu trừ.
        key_facts:
          - "phải có hóa đơn GTGT mới được khấu trừ"
          - "không có hóa đơn thì không được khấu trừ thuế đầu vào"
        provisions:
          - 48/2024/QH15 Điều 14
          - 181/2025/NĐ-CP Điều 26
          - 144/2026/NĐ-CP Điều 4
      - question: Vậy khoản chi đó có được tính vào chi phí khi tính thuế TNDN không?
        tax_type: cit
        form: plain
        answer: >
          Có thể. Mua hàng của hộ kinh doanh có doanh thu dưới ngưỡng chịu thuế GTGT thì được tính vào chi phí được trừ khi có
          chứng từ chi trả tiền cho người bán và Bảng kê thu mua hàng hóa, dịch vụ (Mẫu số 02/TNDN) do người đại diện doanh nghiệp
          ký. Giá trị mua trong ngày của một hộ từ 05 triệu đồng trở lên phải thanh toán không dùng tiền mặt.
        key_facts:
          - "cần chứng từ chi trả tiền và Bảng kê thu mua Mẫu số 02/TNDN"
          - "áp dụng khi hộ kinh doanh có doanh thu dưới ngưỡng chịu thuế GTGT"
          - "từ 05 triệu đồng trong ngày phải thanh toán không dùng tiền mặt"
        provisions:
          - 320/2025/NĐ-CP Điều 9 khoản 1
          - 20/2026/TT-BTC Điều 3 khoản 13
  - id: c12
    added_in: 2
    turns:
      - question: Hàng trong kho bị cháy hết thì thuế GTGT đầu vào đã khấu trừ của lô hàng đó có phải điều chỉnh không?
        tax_type: vat
        form: plain
        answer: >
          Không phải điều chỉnh giảm. Thuế GTGT đầu vào không được bồi thường của hàng hóa chịu thuế bị tổn thất vẫn được khấu
          trừ toàn bộ. Doanh nghiệp phải có đủ hồ sơ, tài liệu chứng minh tổn thất không được bồi thường.
        key_facts:
          - "thuế đầu vào không được bồi thường của hàng tổn thất vẫn được khấu trừ"
          - "phải có hồ sơ chứng minh tổn thất không được bồi thường"
        provisions:
          - 48/2024/QH15 Điều 14
          - 181/2025/NĐ-CP Điều 23 khoản 1
      - question: Nếu công ty bảo hiểm bồi thường thì công ty mình có phải xuất hóa đơn cho khoản bồi thường đó không?
        tax_type: vat
        form: plain
        answer: >
          Không. Khoản thu bồi thường bằng tiền không liên quan đến bán hàng hóa, cung cấp dịch vụ nên không phải lập hóa đơn và
          không tính vào giá tính thuế GTGT.
        key_facts:
          - "tiền bồi thường không phải lập hóa đơn"
          - "không tính vào giá tính thuế GTGT"
        provisions:
          - 254/2026/NĐ-CP Điều 7
          - 181/2025/NĐ-CP Điều 14
      - question: Còn phần thiệt hại không được bồi thường thì có được tính vào chi phí được trừ không?
        tax_type: cit
        form: plain
        answer: >
          Có. Phần giá trị tổn thất do thiên tai, dịch bệnh và bất khả kháng khác (gồm cả hỏa hoạn) không được bồi thường là chi
          phí được trừ, bằng tổng giá trị tổn thất trừ phần bảo hiểm hoặc bên khác bồi thường. Hồ sơ gồm biên bản kiểm kê giá trị
          tài sản, hàng hóa tổn thất, bảng kê xuất nhập tồn hàng tổn thất và hồ sơ bồi thường của bảo hiểm (nếu có).
        key_facts:
          - "phần tổn thất do hỏa hoạn không được bồi thường là chi phí được trừ"
          - "bằng tổng giá trị tổn thất trừ phần được bồi thường"
          - "cần biên bản kiểm kê giá trị tài sản, hàng hóa tổn thất"
        provisions:
          - 67/2025/QH15 Điều 9
          - 320/2025/NĐ-CP Điều 9 khoản 2
          - 20/2026/TT-BTC Điều 3 khoản 7
  - id: c13
    added_in: 2
    turns:
      - question: Tôi được công ty cử đi làm ở nước ngoài 6 tháng, lương vẫn trả ở Việt Nam thì có phải nộp thuế thu nhập cá nhân ở Việt Nam không?
        tax_type: pit
        form: plain
        answer: >
          Có, nếu bạn vẫn là cá nhân cư trú: có mặt tại Việt Nam từ 183 ngày trở lên trong năm, hoặc có nơi ở thường xuyên tại
          Việt Nam (nơi đăng ký thường trú hoặc nhà thuê theo hợp đồng có thời hạn). Cá nhân cư trú chịu thuế trên thu nhập phát
          sinh trong và ngoài Việt Nam, không phân biệt nơi trả.
        key_facts:
          - "cá nhân cư trú chịu thuế trên thu nhập trong và ngoài Việt Nam"
          - "cư trú khi có mặt từ 183 ngày hoặc có nơi ở thường xuyên tại Việt Nam"
        provisions:
          - 109/2025/QH15 Điều 2
          - 253/2026/NĐ-CP Điều 6
      - question: Nếu bên đó cũng đã trừ thuế của tôi rồi thì sao?
        tax_type: pit
        form: plain
        answer: >
          Nếu Việt Nam đã ký Hiệp định tránh đánh thuế hai lần với nước đó thì số thuế TNCN đã nộp ở nước ngoài được trừ vào số
          thuế phải nộp ở Việt Nam theo quy định của Hiệp định.
        key_facts:
          - "được trừ thuế đã nộp ở nước ngoài"
          - "khi có Hiệp định tránh đánh thuế hai lần, theo quy định của Hiệp định"
        provisions:
          - 253/2026/NĐ-CP Điều 6
  - id: c14
    added_in: 2
    turns:
      - question: Tôi có thu nhập từ bán hàng đa cấp thì công ty đa cấp có khấu trừ thuế thay tôi không?
        tax_type: pit
        form: plain
        answer: >
