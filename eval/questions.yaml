      68/2026/NĐ-CP, áp dụng từ 01/01/2026: hộ kinh doanh có doanh thu năm từ 01 tỷ đồng trở xuống không phải nộp thuế GTGT,
      TNCN. Các văn bản không có thông tin về dự định khác của Bộ Tài chính.
    key_facts:
