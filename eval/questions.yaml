        tax_type: pit
        form: plain
        answer: >
          Không. Chỉ được ủy quyền cho tổ chức trả thu nhập khi có hợp đồng lao động từ 03 tháng trở lên và thực tế đang làm việc
          tại đó vào thời điểm quyết toán thuế. Đã nghỉ việc ở công ty cũ thì không ủy quyền cho công ty cũ được, dù không cần
          làm đủ 12 tháng.
