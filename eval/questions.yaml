      - 50/2026/TT-BTC Điều 2
      - 68/2026/NĐ-CP Điều 12
      - 141/2026/NĐ-CP Điều 1
    added_in: 2
  - id: q242  # step 2: the question names Điều 5, but the rule is in 68/2026/NĐ-CP Điều 4 khoản 1 (amended by 141/2026/NĐ-CP Điều 1)
    question: Theo Điều 5 Nghị định 68/2026, những cá nhân kinh doanh nào không phải nộp thuế?
    tax_type: household
