# GitHub closes issues from "Closes #N" only when the change reaches the default branch (main).
# Work here merges into develop, so this does the same on develop: a merged PR or pushed commit
# that says "Closes #N" (or fixes / resolves) closes issue N with a link back to the change.
# CONVENTIONS.md §7: issues are closed by the merge, never by hand.
name: Close issues on develop

on:
  # pull_request_target so it also runs for PRs from forks; it never checks out PR code,
  # it only reads PR text and commit messages through the API.
  pull_request_target:
    types: [closed]
    branches: [develop]
  push:
    branches: [develop]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  close:
    if: github.event_name == 'push' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const KEYWORD = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s+#(\d+)\b/gi;
            const { owner, repo } = context.repo;

            // Collect [text, link to the change] pairs from the event.
            const sources = [];
            if (context.eventName === 'pull_request_target') {
              const pr = context.payload.pull_request;
              sources.push([`${pr.title}\n${pr.body ?? ''}`, `#${pr.number}`]);
              const commits = await github.paginate(github.rest.pulls.listCommits,
                { owner, repo, pull_number: pr.number, per_page: 100 });
              for (const c of commits) sources.push([c.commit.message, `#${pr.number}`]);
            } else {
              const { before, after } = context.payload;
              if (/^0+$/.test(before)) return;  // branch just created: nothing to compare
              const { data } = await github.rest.repos.compareCommits(
                { owner, repo, base: before, head: after });
              for (const c of data.commits) sources.push([c.commit.message, c.sha]);
            }

            const toClose = new Map();  // issue number -> first change that closes it
            for (const [text, ref] of sources) {
              for (const m of text.matchAll(KEYWORD)) {
                const n = Number(m[1]);
                if (!toClose.has(n)) toClose.set(n, ref);
              }
            }

            for (const [number, ref] of toClose) {
              let issue;
              try {
                ({ data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number }));
              } catch (e) {
                core.warning(`#${number}: not found, skipped`);
                continue;
              }
              if (issue.pull_request || issue.state === 'closed') continue;  // a PR, or already closed
              await github.rest.issues.createComment({ owner, repo, issue_number: number,
                body: `Closed by ${ref}, merged into \`develop\`.` });
              await github.rest.issues.update({ owner, repo, issue_number: number,
                state: 'closed', state_reason: 'completed' });
              core.info(`#${number} closed by ${ref}`);
            }
